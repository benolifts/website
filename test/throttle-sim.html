// Note lengths are expressed as multiples of a quarter note.
// 3/4, 1.5 and 3 are dotted note values.

const MUSIC_NOTE_LENGTHS = [
    { key: "demisemiquaver", label: "1/8", ratio: 0.125, dotted: false },
    { key: "semiquaver", label: "1/4", ratio: 0.25, dotted: false },
    { key: "quaver", label: "1/2", ratio: 0.5, dotted: false },
    { key: "dottedQuaver", label: "3/4", ratio: 0.75, dotted: true },
    { key: "crotchet", label: "1", ratio: 1, dotted: false },
    { key: "dottedCrotchet", label: "1.5", ratio: 1.5, dotted: true },
    { key: "minim", label: "2", ratio: 2, dotted: false },
    { key: "dottedMinim", label: "3", ratio: 3, dotted: true },
    { key: "semibreve", label: "4", ratio: 4, dotted: false }
];

const MUSIC_NOTE_NAMES = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
];

const MUSIC_NOTE_NAMES_FLATS = [
    "C", "Db", "D", "Eb", "E", "F",
    "Gb", "G", "Ab", "A", "Bb", "B"
];

const MUSIC_WHITE_KEYS = [0, 2, 4, 5, 7, 9, 11];

// C2 through F#6.
const MUSIC_FIRST_MIDI = 36;
const MUSIC_LAST_MIDI = 90;

// Equal temperament plus useful five-limit just-intonation
// profiles for all major and minor keys.
const MUSIC_TUNING_PROFILES = [
    { label: "Universal · 12-TET", mode: "equal", root: null },

    { label: "C Major · Just", mode: "major", root: 0 },
    { label: "G Major · Just", mode: "major", root: 7 },
    { label: "D Major · Just", mode: "major", root: 2 },
    { label: "A Major · Just", mode: "major", root: 9 },
    { label: "E Major · Just", mode: "major", root: 4 },
    { label: "B Major · Just", mode: "major", root: 11 },
    { label: "F# Major · Just", mode: "major", root: 6 },
    { label: "Db Major · Just", mode: "major", root: 1 },
    { label: "Ab Major · Just", mode: "major", root: 8 },
    { label: "Eb Major · Just", mode: "major", root: 3 },
    { label: "Bb Major · Just", mode: "major", root: 10 },
    { label: "F Major · Just", mode: "major", root: 5 },

    { label: "A Minor · Just", mode: "minor", root: 9 },
    { label: "E Minor · Just", mode: "minor", root: 4 },
    { label: "B Minor · Just", mode: "minor", root: 11 },
    { label: "F# Minor · Just", mode: "minor", root: 6 },
    { label: "C# Minor · Just", mode: "minor", root: 1 },
    { label: "G# Minor · Just", mode: "minor", root: 8 },
    { label: "D# Minor · Just", mode: "minor", root: 3 },
    { label: "Bb Minor · Just", mode: "minor", root: 10 },
    { label: "F Minor · Just", mode: "minor", root: 5 },
    { label: "C Minor · Just", mode: "minor", root: 0 },
    { label: "G Minor · Just", mode: "minor", root: 7 },
    { label: "D Minor · Just", mode: "minor", root: 2 }
];

// Five-limit chromatic ratios relative to the tonic.
const MUSIC_JUST_RATIOS = [
    1,
    16 / 15,
    9 / 8,
    6 / 5,
    5 / 4,
    4 / 3,
    45 / 32,
    3 / 2,
    8 / 5,
    5 / 3,
    9 / 5,
    15 / 8
];

let musicNotes = [];

let musicSelectedLength = "crotchet";
let musicQuarterMs = 500;
let musicTuningIndex = 0;
let musicNotation = "sharps";

let musicHeldMidi = null;
let musicHeldPointer = null;
let musicLastPreviewFrequency = 440;

let musicPlaybackID = 0;
let musicPlayingNoteIndex = -1;

let musicCanvasButtons = [];
let musicWhiteKeys = [];
let musicBlackKeys = [];


// ========================================================
// NOTE CONVERSION
// ========================================================

function musicMidiToFrequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
}


function musicFrequencyToMidi(frequency) {
    if (!Number.isFinite(frequency) || frequency <= 0) {
        return null;
    }

    return Math.round(
        69 + 12 * Math.log2(frequency / 440)
    );
}


function musicGetPitch(midi) {
    const names = musicNotation === "flats"
        ? MUSIC_NOTE_NAMES_FLATS
        : MUSIC_NOTE_NAMES;

    const pitch = names[midi % 12];

    return {
        name: pitch,
        letter: pitch[0],
        accidental: pitch.length > 1,
        accidentalSymbol: pitch.length > 1
            ? (musicNotation === "flats" ? "♭" : "♯")
            : "",
        octave: Math.floor(midi / 12) - 1
    };
}


function musicGetLength(key) {
    return MUSIC_NOTE_LENGTHS.find(note => note.key === key)
        ?? MUSIC_NOTE_LENGTHS[4];
}


function musicGetLengthFromDuration(duration) {
    let best = MUSIC_NOTE_LENGTHS[4];
    let bestError = Infinity;

    for (const note of MUSIC_NOTE_LENGTHS) {
        const expected = musicQuarterMs * note.ratio;

        const error = Math.abs(
            Math.log(Math.max(1, duration) / expected)
        );

        if (error < bestError) {
            bestError = error;
            best = note;
        }
    }

    return best;
}


function musicGetDuration(length) {
    return Math.max(
        1,
        Math.round(
            musicQuarterMs * musicGetLength(length).ratio
        )
    );
}


// ========================================================
// TEMPO ESTIMATION ON IMPORT
// ========================================================

// Estimate a quarter-note duration from imported milliseconds.
// Assumes a modern pop tempo, approximately 70-180 BPM.

function musicEstimateTempo(beats) {
    const durations = beats
        .map(Number)
        .filter(value =>
            Number.isFinite(value) && value > 0
        );

    if (!durations.length) return 500;

    let bestQuarter = 500;
    let bestScore = Infinity;

    for (let bpm = 70; bpm <= 180; bpm += 0.5) {
        const quarter = 60000 / bpm;

        let score = 0;

        for (const duration of durations) {
            let bestError = Infinity;

            for (const note of MUSIC_NOTE_LENGTHS) {
                const expected = quarter * note.ratio;

                const error = Math.abs(
                    Math.log(duration / expected)
                );

                bestError = Math.min(bestError, error);
            }

            score += bestError * bestError;
        }

        score /= durations.length;

        // Slight preference for common pop tempos.
        score += Math.pow((bpm - 120) / 100, 2) * 0.0001;

        if (score < bestScore) {
            bestScore = score;
            bestQuarter = quarter;
        }
    }

    return bestQuarter;
}


// ========================================================
// KEY ESTIMATION ON IMPORT
// ========================================================

// Uses pitch-class distribution to estimate the most likely
// major or minor key. Short melodies may remain ambiguous.

function musicEstimateTuning(frequencies, beats) {
    const notes = frequencies
        .map((frequency, index) => ({
            midi: musicFrequencyToMidi(Number(frequency)),
            duration: Math.max(
                1,
                Number(beats[index]) || 1
            )
        }))
        .filter(note => note.midi !== null);

    if (notes.length < 4) return 0;

    const chroma = new Array(12).fill(0);

    for (const note of notes) {
        const weight = Math.sqrt(
            Math.max(0.1, note.duration / 500)
        );

        chroma[note.midi % 12] += weight;
    }

    const majorProfile = [
        6.35, 2.23, 3.48, 2.33, 4.38, 4.09,
        2.52, 5.19, 2.39, 3.66, 2.29, 2.88
    ];

    const minorProfile = [
        6.33, 2.68, 3.52, 5.38, 2.60, 3.53,
        2.54, 4.75, 3.98, 2.69, 3.34, 3.17
    ];

    let bestIndex = 0;
    let bestScore = -Infinity;

    for (
        let index = 1;
        index < MUSIC_TUNING_PROFILES.length;
        index++
    ) {
        const candidate = MUSIC_TUNING_PROFILES[index];

        const profile = candidate.mode === "major"
            ? majorProfile
            : minorProfile;

        let score = 0;

        for (let pitch = 0; pitch < 12; pitch++) {
            const relativePitch =
                (pitch - candidate.root + 12) % 12;

            score += chroma[pitch] * profile[relativePitch];
        }

        // Give the final note some additional weight as
        // pop melodies commonly finish on the tonic.
        const finalMidi = notes[notes.length - 1].midi;

        if (finalMidi % 12 === candidate.root) {
            score += chroma[candidate.root] * 1.5;
        }

        if (score > bestScore) {
            bestScore = score;
            bestIndex = index;
        }
    }

    return bestIndex;
}


// ========================================================
// KEY-SPECIFIC FREQUENCY TUNING
// ========================================================

function musicTuneFrequency(midi) {
    const profile =
        MUSIC_TUNING_PROFILES[musicTuningIndex];

    if (!profile || profile.mode === "equal") {
        return musicMidiToFrequency(midi);
    }

    const interval =
        (midi - profile.root + 12) % 12;

    const rootMidi = midi - interval;

    return (
        musicMidiToFrequency(rootMidi) *
        MUSIC_JUST_RATIOS[interval]
    );
}


function musicApplyTuning() {
    for (const note of musicNotes) {
        if (!note.rest && note.midi !== null) {
            note.frequency = musicTuneFrequency(note.midi);
        }
    }

    syncMusicData();
    drawMusicEditor();
}


// ========================================================
// SAVE MUSIC CONFIGURATION
// ========================================================

function syncMusicData() {
    if (!activeMusicSession) return;

    activeMusicSession.data.frequencies =
        musicNotes.map(note => note.frequency);

    activeMusicSession.data.beats =
        musicNotes.map(note => note.duration);
}


// ========================================================
// NOTES AND RESTS
// ========================================================

function addMusicNote(midi) {
    musicNotes.push({
        midi,
        frequency: musicTuneFrequency(midi),
        duration: musicGetDuration(musicSelectedLength),
        length: musicSelectedLength,
        rest: false
    });

    syncMusicData();
    drawMusicEditor();
}


function addMusicRest() {
    musicNotes.push({
        midi: null,
        frequency: 0,
        duration: musicGetDuration(musicSelectedLength),
        length: musicSelectedLength,
        rest: true
    });

    syncMusicData();
    drawMusicEditor();
}


function deleteMusicNote() {
    if (!musicNotes.length) return;

    musicPlaybackID++;
    musicPlayingNoteIndex = -1;

    musicNotes.pop();

    syncMusicData();
    drawMusicEditor();
}


// ========================================================
// TEMPO CONTROL
// ========================================================

function changeMusicTempo(direction) {
    const currentBpm = 60000 / musicQuarterMs;

    const newBpm = Math.max(
        40,
        Math.min(240, currentBpm + direction)
    );

    musicQuarterMs = 60000 / newBpm;

    // Keep the selected note values, but recalculate
    // their millisecond durations using the new tempo.
    for (const note of musicNotes) {
        note.duration = musicGetDuration(note.length);
    }

    syncMusicData();
    drawMusicEditor();
}


// ========================================================
// AUDIO
// ========================================================

// Motor frequency is deliberately kept at zero.
// The musical note is supplied as the DC-PWM carrier.
// A 50% duty cycle produces the audible square-wave tone.

function sendMusicTone(frequency, power) {
    if (!soundUpdateFunction) return;

    const safeFrequency =
        Number.isFinite(frequency) && frequency > 0
            ? frequency
            : 440;

    soundUpdateFunction({
        mode: "DC-PWM",
        frequency: 0,
        carrier_frequency: safeFrequency,
        pulses: 1,
        power
    }, 1);
}


async function previewMusicKey(midi) {
    const session = activeMusicSession;
    const noteFrequency = musicTuneFrequency(midi);

    musicLastPreviewFrequency = noteFrequency;

    try {
        await ensureSoundStarted();

        if (
            activeMusicSession !== session ||
            musicHeldMidi !== midi
        ) {
            return;
        }

        sendMusicTone(noteFrequency, 0.5);

    } catch (error) {
        console.error("Could not play keyboard note:", error);
    }
}


function releaseMusicKey() {
    if (musicHeldMidi === null) return;

    sendMusicTone(musicLastPreviewFrequency, 0);

    musicHeldMidi = null;
    musicHeldPointer = null;

    drawMusicEditor();
}


// ========================================================
// PLAYBACK STOP
// ========================================================

function stopMusicSequence() {
    musicPlaybackID++;
    musicPlayingNoteIndex = -1;

    sendMusicTone(440, 0);

    drawMusicEditor();
}


// ========================================================
// PLAY ONE ROUND OF THE MUSIC
// ========================================================

async function playMusicSequence() {
    if (!musicNotes.length || !activeMusicSession) return;

    const session = activeMusicSession;
    const playbackID = ++musicPlaybackID;

    const sequence = musicNotes.map(note => ({ ...note }));

    if (musicHeldMidi !== null) {
        releaseMusicKey();
    }

    musicPlayingNoteIndex = -1;
    drawMusicEditor();

    try {
        await ensureSoundStarted();

        if (
            activeMusicSession !== session ||
            playbackID !== musicPlaybackID ||
            !soundUpdateFunction
        ) {
            return;
        }

        for (let i = 0; i < sequence.length; i++) {
            if (
                playbackID !== musicPlaybackID ||
                activeMusicSession !== session
            ) {
                break;
            }

            const note = sequence[i];

            // Highlight the note currently being played.
            musicPlayingNoteIndex = i;
            drawMusicEditor();

            if (note.rest || note.frequency <= 0) {
                sendMusicTone(440, 0);
            } else {
                sendMusicTone(note.frequency, 0.5);
            }

            await new Promise(resolve =>
                setTimeout(resolve, note.duration)
            );
        }

        if (
            playbackID === musicPlaybackID &&
            activeMusicSession === session
        ) {
            sendMusicTone(440, 0);
            musicPlayingNoteIndex = -1;
            drawMusicEditor();
        }

    } catch (error) {
        console.error("Music playback failed:", error);

        if (playbackID === musicPlaybackID) {
            musicPlayingNoteIndex = -1;
            drawMusicEditor();
        }
    }
}


// ========================================================
// DRAW NOTE SYMBOLS
// ========================================================

function drawMusicNoteSymbol(
    ctx,
    x,
    y,
    note,
    colour,
    scale = 1
) {
    const ratio = note.ratio;

    // Minims and longer have open note heads.
    const open = ratio >= 2;

    // All notes shorter than a semibreve have stems.
    const hasStem = ratio < 4;

    // Number of flags for shorter notes.
    const flagCount =
        ratio <= 0.125 ? 3 :
        ratio <= 0.25 ? 2 :
        ratio < 1 ? 1 : 0;

    ctx.save();

    ctx.strokeStyle = colour;
    ctx.fillStyle = colour;
    ctx.lineWidth = 1.7 * scale;
    ctx.lineCap = "round";

    // Note head.
    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        6.5 * scale,
        4.5 * scale,
        -0.25,
        0,
        Math.PI * 2
    );

    if (open) {
        ctx.stroke();
    } else {
        ctx.fill();
    }

    // Stem.
    if (hasStem) {
        const stemX = x + 5.5 * scale;
        const stemTop = y - 25 * scale;

        ctx.beginPath();
        ctx.moveTo(stemX, y);
        ctx.lineTo(stemX, stemTop);
        ctx.stroke();

        // Flags: one for quaver, two for semiquaver,
        // three for demisemiquaver.
        for (let i = 0; i < flagCount; i++) {
            const flagY = stemTop + i * 5 * scale;

            ctx.beginPath();
            ctx.moveTo(stemX, flagY);

            ctx.quadraticCurveTo(
                stemX + 13 * scale,
                flagY + 7 * scale,
                stemX + 7 * scale,
                flagY + 14 * scale
            );

            ctx.stroke();
        }
    }

    // Dotted notes.
    if (note.dotted) {
        ctx.beginPath();

        ctx.arc(
            x + 13 * scale,
            y - 2 * scale,
            2.2 * scale,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


function drawMusicRestSymbol(ctx, x, y, note, colour) {
    ctx.save();

    ctx.strokeStyle = colour;
    ctx.fillStyle = colour;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (note.ratio >= 4) {
        // Whole-note and longer rests.
        ctx.fillRect(
            x - 7,
            y + 1,
            14,
            5
        );

        if (note.ratio >= 8) {
            ctx.fillStyle = colour;
            ctx.font = "10px Arial";
            ctx.fillText(
                note.ratio === 8 ? "2" :
                note.ratio === 12 ? "3" : "4",
                x + 11,
                y + 7
            );
        }

    } else if (note.ratio >= 2) {
        // Half-note rest.
        ctx.fillRect(
            x - 7,
            y - 5,
            14,
            5
        );

    } else {
        // Quarter and eighth-note rests.
        ctx.beginPath();
        ctx.moveTo(x + 3, y - 15);
        ctx.lineTo(x - 3, y - 5);
        ctx.lineTo(x + 3, y + 2);
        ctx.lineTo(x - 3, y + 10);
        ctx.lineTo(x + 2, y + 15);
        ctx.stroke();

        if (note.ratio === 0.5) {
            ctx.beginPath();
            ctx.arc(x + 7, y - 9, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    if (note.dotted) {
        ctx.beginPath();
        ctx.arc(x + 12, y - 2, 2.2, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}


// ========================================================
// DRAW TREBLE AND BASS STAFF
// ========================================================

function drawMusicStaff(ctx, top, clef, width, gap) {
    ctx.save();

    ctx.strokeStyle = "#b9b79c";
    ctx.lineWidth = 1;

    for (let i = 0; i < 5; i++) {
        const y = top + i * gap;

        ctx.beginPath();
        ctx.moveTo(48, y);
        ctx.lineTo(width - 12, y);
        ctx.stroke();
    }

    ctx.fillStyle = "#f0dc65";
    ctx.font = "bold 10px Arial";

    ctx.fillText(
        clef === "treble" ? "TREBLE" : "BASS",
        5,
        top - 5
    );

    ctx.font = "39px serif";

    ctx.fillText(
        clef === "treble" ? "𝄞" : "𝄢",
        8,
        top + gap * 4 + 5
    );

    ctx.restore();
}


function drawMusicScoreNote(
    ctx,
    note,
    x,
    trebleTop,
    bassTop,
    gap,
    highlighted = false
) {
    const noteColour = highlighted
        ? "#00d9ff"
        : "#f0efce";

    if (note.rest || note.frequency <= 0) {
        drawMusicRestSymbol(
            ctx,
            x,
            trebleTop + gap * 2,
            musicGetLength(note.length),
            noteColour
        );

        return;
    }

    const midi = note.midi ??
        musicFrequencyToMidi(note.frequency);

    if (midi === null) return;

    const pitch = musicGetPitch(midi);

    const treble = midi >= 60;
    const top = treble ? trebleTop : bassTop;
    const bottomY = top + 4 * gap;

    const letterIndex = {
        C: 0,
        D: 1,
        E: 2,
        F: 3,
        G: 4,
        A: 5,
        B: 6
    }[pitch.letter];

    const absoluteStep =
        pitch.octave * 7 + letterIndex;

    // Treble bottom line = E4.
    // Bass bottom line = G2.
    const baseStep = treble
        ? 4 * 7 + 2
        : 2 * 7 + 4;

    const stepDifference =
        absoluteStep - baseStep;

    const y = bottomY - stepDifference * gap / 2;

    // Ledger lines.
    ctx.save();

    ctx.strokeStyle = "#b9b79c";
    ctx.lineWidth = 1;

    if (stepDifference >= 10) {
        for (let s = 10; s <= stepDifference; s += 2) {
            const ledgerY = bottomY - s * gap / 2;

            ctx.beginPath();
            ctx.moveTo(x - 10, ledgerY);
            ctx.lineTo(x + 10, ledgerY);
            ctx.stroke();
        }

    } else if (stepDifference <= -2) {
        for (let s = -2; s >= stepDifference; s -= 2) {
            const ledgerY = bottomY - s * gap / 2;

            ctx.beginPath();
            ctx.moveTo(x - 10, ledgerY);
            ctx.lineTo(x + 10, ledgerY);
            ctx.stroke();
        }
    }

    ctx.restore();

    // Sharps or flats are purely visual notation choices.
    if (pitch.accidental) {
        ctx.fillStyle = noteColour;
        ctx.font = "19px serif";

        ctx.fillText(
            pitch.accidentalSymbol,
            x - 17,
            y + 6
        );
    }

    drawMusicNoteSymbol(
        ctx,
        x,
        y,
        musicGetLength(note.length),
        noteColour,
        0.85
    );
}


// ========================================================
// CANVAS BUTTONS
// ========================================================

function addMusicCanvasButton(
    ctx,
    x,
    y,
    width,
    height,
    label,
    action,
    selected = false,
    fontSize = 11
) {
    ctx.save();

    ctx.fillStyle = selected ? "#494326" : "#252525";
    ctx.strokeStyle = selected ? "#f0dc65" : "#777";
    ctx.lineWidth = selected ? 2 : 1;

    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = "#f0efce";
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        label,
        x + width / 2,
        y + height / 2
    );

    ctx.restore();

    musicCanvasButtons.push({
        x,
        y,
        width,
        height,
        action
    });
}


// ========================================================
// NOTE LENGTH SELECTOR
// ========================================================

function drawMusicToolbar(ctx, width) {
    const margin = 7;
    const gap = 3;
    const y = 7;
    const height = 45;

    const buttonWidth =
        (width - margin * 2 - gap * 8) / 9;

    MUSIC_NOTE_LENGTHS.forEach((note, index) => {
        const x = margin + index * (buttonWidth + gap);

        const selected =
            musicSelectedLength === note.key;

        ctx.save();

        ctx.fillStyle = selected ? "#494326" : "#252525";
        ctx.strokeStyle = selected ? "#f0dc65" : "#777";
        ctx.lineWidth = selected ? 2 : 1;

        ctx.fillRect(x, y, buttonWidth, height);
        ctx.strokeRect(x, y, buttonWidth, height);

        drawMusicNoteSymbol(
            ctx,
            x + buttonWidth / 2 - 2,
            y + 16,
            note,
            "#f0efce",
            0.55
        );

        ctx.fillStyle = "#f0efce";
        ctx.font = "bold 10px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            note.label,
            x + buttonWidth / 2,
            y + 36
        );

        ctx.restore();

        musicCanvasButtons.push({
            x,
            y,
            width: buttonWidth,
            height,
            action: () => {
                musicSelectedLength = note.key;
                drawMusicEditor();
            }
        });
    });
}


// ========================================================
// REST AND DELETE BUTTONS
// ========================================================

// Rest and Delete sit side by side directly below the score.
// Both buttons have exactly the same dimensions.

function drawMusicRestDeleteButtons(ctx, width, y) {
    const buttonWidth = Math.min(130, (width - 36) / 2);
    const buttonHeight = 38;
    const gap = 10;

    const totalWidth = buttonWidth * 2 + gap;
    const startX = (width - totalWidth) / 2;

    const restX = startX;
    const deleteX = startX + buttonWidth + gap;

    // Rest button.
    ctx.save();

    ctx.fillStyle = "#252525";
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 1;

    ctx.fillRect(
        restX,
        y,
        buttonWidth,
        buttonHeight
    );

    ctx.strokeRect(
        restX,
        y,
        buttonWidth,
        buttonHeight
    );

    drawMusicRestSymbol(
        ctx,
        restX + buttonWidth * 0.28,
        y + buttonHeight / 2,
        musicGetLength(musicSelectedLength),
        "#f0efce"
    );

    ctx.fillStyle = "#f0efce";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "REST",
        restX + buttonWidth * 0.7,
        y + buttonHeight / 2
    );

    ctx.restore();

    musicCanvasButtons.push({
        x: restX,
        y,
        width: buttonWidth,
        height: buttonHeight,
        action: addMusicRest
    });

    // Delete button.
    addMusicCanvasButton(
        ctx,
        deleteX,
        y,
        buttonWidth,
        buttonHeight,
        "DELETE",
        deleteMusicNote,
        false,
        12
    );
}


// ========================================================
// TUNING SELECTOR
// ========================================================

// The tuning selector now occupies part of the main control bar.

function drawMusicTuningSelector(ctx, x, y, width, height) {
    const arrowWidth = Math.min(25, width * 0.17);

    ctx.save();

    ctx.fillStyle = "#171717";
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 1;

    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = "#b9b79c";
    ctx.font = "bold 9px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "TUNING",
        x + width / 2,
        y + 11
    );

    ctx.fillStyle = "#f0dc65";
    ctx.font = "bold 11px Arial";

    ctx.fillText(
        MUSIC_TUNING_PROFILES[musicTuningIndex].label,
        x + width / 2,
        y + 30,
        Math.max(10, width - arrowWidth * 2 - 8)
    );

    ctx.restore();

    addMusicCanvasButton(
        ctx,
        x + 2,
        y + 4,
        arrowWidth,
        height - 8,
        "◀",
        () => {
            musicTuningIndex =
                (musicTuningIndex - 1 + MUSIC_TUNING_PROFILES.length) %
                MUSIC_TUNING_PROFILES.length;

            musicApplyTuning();
        },
        false,
        10
    );

    addMusicCanvasButton(
        ctx,
        x + width - arrowWidth - 2,
        y + 4,
        arrowWidth,
        height - 8,
        "▶",
        () => {
            musicTuningIndex =
                (musicTuningIndex + 1) %
                MUSIC_TUNING_PROFILES.length;

            musicApplyTuning();
        },
        false,
        10
    );
}


// ========================================================
// PLAY / STOP / TEMPO / TUNING / NOTATION CONTROL BAR
// ========================================================

function drawMusicControls(ctx, width, y) {
    const margin = 8;
    const panelHeight = 60;
    const gap = 5;

    const panelX = margin;
    const panelWidth = width - margin * 2;

    ctx.save();

    ctx.fillStyle = "#222";
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 1;

    ctx.fillRect(
        panelX,
        y,
        panelWidth,
        panelHeight
    );

    ctx.strokeRect(
        panelX,
        y,
        panelWidth,
        panelHeight
    );

    ctx.restore();

    const innerX = panelX + 6;
    const innerWidth = panelWidth - 12 - gap * 3;

    const playStopWidth = innerWidth * 0.24;
    const tempoWidth = innerWidth * 0.25;
    const tuningWidth = innerWidth * 0.36;
    const viewWidth =
        innerWidth - playStopWidth - tempoWidth - tuningWidth;

    const buttonY = y + 8;
    const buttonHeight = 44;

    let x = innerX;

    // PLAY and STOP buttons.
    const playStopGap = 3;
    const individualButtonWidth =
        (playStopWidth - playStopGap) / 2;

    addMusicCanvasButton(
        ctx,
        x,
        buttonY,
        individualButtonWidth,
        buttonHeight,
        "PLAY",
        playMusicSequence,
        false,
        11
    );

    addMusicCanvasButton(
        ctx,
        x + individualButtonWidth + playStopGap,
        buttonY,
        individualButtonWidth,
        buttonHeight,
        "STOP",
        stopMusicSequence,
        false,
        11
    );

    x += playStopWidth + gap;

    // Tempo display.
    ctx.save();

    ctx.fillStyle = "#171717";
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 1;

    ctx.fillRect(
        x,
        buttonY,
        tempoWidth,
        buttonHeight
    );

    ctx.strokeRect(
        x,
        buttonY,
        tempoWidth,
        buttonHeight
    );

    const smallWidth = Math.min(22, tempoWidth * 0.2);

    ctx.fillStyle = "#f0dc65";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        `${Math.round(60000 / musicQuarterMs)} BPM`,
        x + tempoWidth / 2,
        buttonY + 17
    );

    ctx.fillStyle = "#b9b79c";
    ctx.font = "9px Arial";

    ctx.fillText(
        `${Math.round(musicQuarterMs)} ms / quarter`,
        x + tempoWidth / 2,
        buttonY + 33
    );

    ctx.restore();

    addMusicCanvasButton(
        ctx,
        x + 2,
        buttonY + 8,
        smallWidth,
        28,
        "−",
        () => changeMusicTempo(-5),
        false,
        15
    );

    addMusicCanvasButton(
        ctx,
        x + tempoWidth - smallWidth - 2,
        buttonY + 8,
        smallWidth,
        28,
        "+",
        () => changeMusicTempo(5),
        false,
        15
    );

    x += tempoWidth + gap;

    // Tuning sits directly alongside tempo.
    drawMusicTuningSelector(
        ctx,
        x,
        buttonY,
        tuningWidth,
        buttonHeight
    );

    x += tuningWidth + gap;

    // Notation display.
    addMusicCanvasButton(
        ctx,
        x,
        buttonY,
        viewWidth,
        buttonHeight,
        musicNotation === "sharps"
            ? "VIEW SHARPS"
            : "VIEW FLATS",
        () => {
            musicNotation =
                musicNotation === "sharps"
                    ? "flats"
                    : "sharps";

            drawMusicEditor();
        },
        false,
        9
    );
}


// ========================================================
// PIANO KEYBOARD
// ========================================================

function drawMusicKeyboard(ctx, width, keyboardTop, keyboardHeight) {
    musicWhiteKeys = [];
    musicBlackKeys = [];

    const whiteCount = 32;
    const whiteWidth = width / whiteCount;
    const blackWidth = whiteWidth * 0.62;
    const blackHeight = keyboardHeight * 0.62;

    let whiteIndex = 0;

    // Draw white keys.
    for (
        let midi = MUSIC_FIRST_MIDI;
        midi <= MUSIC_LAST_MIDI;
        midi++
    ) {
        const pitchClass = midi % 12;

        if (!MUSIC_WHITE_KEYS.includes(pitchClass)) continue;

        const x = whiteIndex * whiteWidth;

        const key = {
            midi,
            x,
            y: keyboardTop,
            width: whiteWidth,
            height: keyboardHeight,
            black: false
        };

        musicWhiteKeys.push(key);

        ctx.fillStyle =
            musicHeldMidi === midi ? "#f0dc65" : "#eee";

        ctx.strokeStyle = "#222";
        ctx.lineWidth = 1;

        ctx.fillRect(
            x,
            keyboardTop,
            whiteWidth,
            keyboardHeight
        );

        ctx.strokeRect(
            x,
            keyboardTop,
            whiteWidth,
            keyboardHeight
        );

        // Dot indicates notes already entered.
        if (musicNotes.some(note => note.midi === midi)) {
            ctx.fillStyle = "#a48d25";

            ctx.beginPath();
            ctx.arc(
                x + whiteWidth / 2,
                keyboardTop + keyboardHeight - 29,
                3.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        // Label each C octave.
        if (pitchClass === 0) {
            ctx.fillStyle = "#333";

            ctx.font =
                `${Math.max(7, Math.min(11, whiteWidth * 0.38))}px Arial`;

            ctx.textAlign = "center";

            ctx.fillText(
                `C${Math.floor(midi / 12) - 1}`,
                x + whiteWidth / 2,
                keyboardTop + keyboardHeight - 7
            );
        }

        whiteIndex++;
    }

    // Draw black keys over white keys.
    whiteIndex = 0;

    for (
        let midi = MUSIC_FIRST_MIDI;
        midi <= MUSIC_LAST_MIDI;
        midi++
    ) {
        const pitchClass = midi % 12;

        if (MUSIC_WHITE_KEYS.includes(pitchClass)) {
            whiteIndex++;
            continue;
        }

        const x = whiteIndex * whiteWidth - blackWidth / 2;

        const key = {
            midi,
            x,
            y: keyboardTop,
            width: blackWidth,
            height: blackHeight,
            black: true
        };

        musicBlackKeys.push(key);

        ctx.fillStyle =
            musicHeldMidi === midi ? "#f0dc65" : "#151515";

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;

        ctx.fillRect(
            x,
            keyboardTop,
            blackWidth,
            blackHeight
        );

        ctx.strokeRect(
            x,
            keyboardTop,
            blackWidth,
            blackHeight
        );

        if (musicNotes.some(note => note.midi === midi)) {
            ctx.fillStyle = "#f0dc65";

            ctx.beginPath();
            ctx.arc(
                x + blackWidth / 2,
                keyboardTop + blackHeight - 12,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }
}


// ========================================================
// DRAW COMPLETE MUSIC EDITOR
// ========================================================

function drawMusicEditor() {
    if (!activeMusicSession) return;

    const width = musicEditorCanvas.clientWidth;
    const height = musicEditorCanvas.clientHeight;

    if (width <= 0 || height <= 0) return;

    musicCanvasButtons = [];

    musicEditorCtx.clearRect(0, 0, width, height);

    musicEditorCtx.fillStyle = "#101010";
    musicEditorCtx.fillRect(0, 0, width, height);

    // Note lengths across the top.
    drawMusicToolbar(musicEditorCtx, width);

    // Piano keyboard at the bottom.
    const keyboardHeight = Math.min(
        185,
        Math.max(90, height * 0.28)
    );

    const keyboardTop = height - keyboardHeight;

    // Main control bar above the keyboard.
    const controlsHeight = 60;
    const controlsY = keyboardTop - controlsHeight - 6;

    // REST and DELETE button dimensions.
    const restDeleteHeight = 38;

    // Keep the original available score area and staff positioning.
    const scoreTop = 62;
    const scoreBottom = controlsY - restDeleteHeight - 13;

    const scoreHeight = Math.max(
        10,
        scoreBottom - scoreTop
    );

    const staffGap = Math.max(
        3.5,
        Math.min(9, scoreHeight / 10)
    );

    const staffGroupHeight = staffGap * 10;

    const staffTop =
        scoreTop +
        Math.max(
            0,
            (scoreHeight - staffGroupHeight) / 2
        );

    const bassTop = staffTop + staffGap * 6;
    const staffBottom = bassTop + staffGap * 4;

    // Position REST and DELETE just below the staff,
    // allowing room for ledger lines below the bass staff.
    const restDeleteY = Math.min(
        staffBottom + staffGap * 2 + 8,
        controlsY - restDeleteHeight - 6
    );

    // Treble staff.
    drawMusicStaff(
        musicEditorCtx,
        staffTop,
        "treble",
        width,
        staffGap
    );

    // Bass staff.
    drawMusicStaff(
        musicEditorCtx,
        bassTop,
        "bass",
        width,
        staffGap
    );

    // Draw the entered notes.
    if (musicNotes.length) {
        const left = 82;

        const availableWidth = Math.max(
            20,
            width - left - 18
        );

        const spacing = availableWidth / musicNotes.length;

        musicNotes.forEach((note, index) => {
            const x = left + spacing * (index + 0.5);

            drawMusicScoreNote(
                musicEditorCtx,
                note,
                x,
                staffTop,
                bassTop,
                staffGap,
                index === musicPlayingNoteIndex
            );
        });

    } else {
        musicEditorCtx.fillStyle = "#777";
        musicEditorCtx.font = "13px Arial";
        musicEditorCtx.textAlign = "center";

        musicEditorCtx.fillText(
            "Click the piano keys to enter notes",
            width / 2,
            staffBottom + 22
        );
    }

    // REST and DELETE directly below the sheet music.

// RESIZE
// ========================================================

function resizeMusicEditorCanvas() {
    const bounds =
        musicEditorCanvas.getBoundingClientRect();

    const ratio = window.devicePixelRatio || 1;

    musicEditorCanvas.width = Math.max(
        1,
        Math.floor(bounds.width * ratio)
    );

    musicEditorCanvas.height = Math.max(
        1,
        Math.floor(bounds.height * ratio)
    );

    musicEditorCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    drawMusicEditor();
}


// ========================================================
// POINTER INPUT
// ========================================================

function getMusicCanvasPosition(event) {
    const bounds =
        musicEditorCanvas.getBoundingClientRect();

    return {
        x: event.clientX - bounds.left,
        y: event.clientY - bounds.top
    };
}


function hitMusicButton(point) {
    return musicCanvasButtons.find(button =>
        point.x >= button.x &&
        point.x <= button.x + button.width &&
        point.y >= button.y &&
        point.y <= button.y + button.height
    );
}


function hitMusicKey(point) {
    // Black keys overlap white keys, so test them first.
    const black = musicBlackKeys.find(key =>
        point.x >= key.x &&
        point.x <= key.x + key.width &&
        point.y >= key.y &&
        point.y <= key.y + key.height
    );

    if (black) return black;

    return musicWhiteKeys.find(key =>
        point.x >= key.x &&
        point.x <= key.x + key.width &&
        point.y >= key.y &&
        point.y <= key.y + key.height
    );
}


musicEditorCanvas.addEventListener("pointerdown", event => {
    if (!activeMusicSession) return;

    event.preventDefault();
    event.stopPropagation();

    const point = getMusicCanvasPosition(event);

    const button = hitMusicButton(point);

    if (button) {
        button.action();
        return;
    }

    const key = hitMusicKey(point);

    if (!key) return;

    // Stop any sequence currently playing.
    musicPlaybackID++;
    musicPlayingNoteIndex = -1;

    if (musicHeldMidi !== null) {
        releaseMusicKey();
    }

    musicHeldMidi = key.midi;
    musicHeldPointer = event.pointerId;

    musicEditorCanvas.setPointerCapture(event.pointerId);

    // Enter the note immediately.
    addMusicNote(key.midi);

    // Play the key while the pointer remains held.
    previewMusicKey(key.midi);
});


window.addEventListener("pointerup", event => {
    if (
        musicHeldPointer !== null &&
        event.pointerId === musicHeldPointer
    ) {
        releaseMusicKey();
    }
});


window.addEventListener("pointercancel", event => {
    if (
        musicHeldPointer !== null &&
        event.pointerId === musicHeldPointer
    ) {
        releaseMusicKey();
    }
});


// ========================================================
// OPEN MUSIC EDITOR
// ========================================================

function openMusicEditor(item, commitFunction) {
    if (!item || item.config.mode !== "ASYNC-MUSIC") return;

    activeMusicSession = {
        item,
        commitFunction,
        data: structuredClone(item.config),
        wasPaused: simulationPaused
    };

    musicNotes = [];

    musicSelectedLength = "crotchet";
    musicNotation = "sharps";

    musicQuarterMs = 500;
    musicTuningIndex = 0;

    musicHeldMidi = null;
    musicHeldPointer = null;
    musicPlayingNoteIndex = -1;

    musicPlaybackID++;

    const frequencies = Array.isArray(item.config.frequencies)
        ? item.config.frequencies
        : [];

    const beats = Array.isArray(item.config.beats)
        ? item.config.beats
        : [];

    // Estimate tempo from imported millisecond durations.
    musicQuarterMs = musicEstimateTempo(beats);

    // Estimate the likely major/minor key.
    musicTuningIndex = musicEstimateTuning(
        frequencies,
        beats
    );

    const count = Math.min(
        frequencies.length,
        beats.length
    );

    for (let i = 0; i < count; i++) {
        const frequency = Number(frequencies[i]);
        const duration = Number(beats[i]);

        if (
            !Number.isFinite(frequency) ||
            !Number.isFinite(duration) ||
            duration <= 0
        ) {
            continue;
        }

        const rest = frequency <= 0;

        const midi = rest
            ? null
            : musicFrequencyToMidi(frequency);

        const length = musicGetLengthFromDuration(duration);

        musicNotes.push({
            midi,
            frequency: rest
                ? 0
                : musicTuneFrequency(midi),
            duration: musicGetDuration(length.key),
            length: length.key,
            rest
        });
    }

    // Stop normal train V/F output while editing.
    stopDriveOutput();

    simulationPaused = true;
    previousFrame = performance.now();

    document.querySelector(".app").hidden = true;
    canvas.hidden = true;
    document.querySelector(".status-bar").hidden = true;

    displayArea.hidden = true;
    document.querySelector(".buttons")?.remove();

    musicEditorView.hidden = false;

    requestAnimationFrame(resizeMusicEditorCanvas);
}


// ========================================================
// CLOSE MUSIC EDITOR AND SAVE
// ========================================================

function closeMusicEditor() {
    const session = activeMusicSession;

    if (!session) return;

    musicPlaybackID++;
    musicPlayingNoteIndex = -1;

    // Stop the preview before returning to the simulator.
    sendMusicTone(440, 0);

    musicHeldMidi = null;
    musicHeldPointer = null;

    try {
        session.data.frequencies =
            musicNotes.map(note => note.frequency);

        session.data.beats =
            musicNotes.map(note => note.duration);

        session.item.config = normalisePulsingConfig({
            ...session.item.config,
            ...session.data
        });

        session.item.updateFields();
        session.commitFunction();

    } catch (error) {
        console.error("Could not save music editor:", error);

        alert(
            "Could not save music:\n\n" +
            (error.message ?? error)
        );

    } finally {
        activeMusicSession = null;

        simulationPaused = session.wasPaused;
        previousFrame = performance.now();

        musicEditorView.hidden = true;
        document.querySelector(".app").hidden = false;
        canvas.hidden = false;
        document.querySelector(".status-bar").hidden = false;
    }
}

function prepareTrainForSave() {
    const result = structuredClone(currentTrain);

    delete result.speed_per_motor_hz;
    delete result.audio;

    result.traction = normaliseTraction(result.traction);
    result.audio_mode = normaliseAudioMode(audioSelect.value);

    result.wheel_diameter ??= 0.84;
    result.gear_ratio_motor_side ??= 6;
    result.gear_ratio_wheel_side ??= 1;
    result.max_speed ??= 120;
    result.rolling_resistance ??= 0.3;

    if (result.traction === "DC_RESISTOR") {
        delete result.motor_poles;
        delete result.peak_point;
        delete result.decel_cutoff;

        result.taper_off ??= 1;

        result.controls = normalisePowerControls(
            result.controls,
            "DC_RESISTOR"
        );

    } else {
        delete result.taper_off;

        result.peak_point ??= 50;
        result.decel_cutoff ??= 1;

        if (result.traction === "AC_PWM") {
            result.motor_poles ??= 4;
        } else {
            delete result.motor_poles;
        }

        result.controls = normalisePowerControls(
            result.controls,
            result.traction
        );
    }

    const pulsing = (
        Array.isArray(result.pulsing)
            ? result.pulsing
            : []
    ).map(config =>
        normalisePulsingConfig(config, result)
    );

    delete result.pulsing;
    result.pulsing = pulsing;

    return result;
}

// ========================================================
// DC RESISTOR POWER PROFILE
// ========================================================

function getResistorPowerFraction(
    speedKmh,
    train = currentTrain,
    throttleValue = throttle,
    calculatedTaperEndSpeed = null
) {
    const notches = (train.pulsing ?? [])
        .filter(item => item.mode === "NOTCH")
        .map(item => ({
            ...item,
            min_speed: Number(item.min_speed ?? 0)
        }))
        .sort((a, b) => a.min_speed - b.min_speed);

    if (!notches.length) return 0;

    const throttlePercent =
        Math.abs(Number(throttleValue)) * 100;

    if (throttlePercent === 0) return 0;

    const maxSpeed = Number(train.max_speed ?? 120);

    const suppliedTaperEnd =
        Number(calculatedTaperEndSpeed);

    const finalSpeed =
        calculatedTaperEndSpeed != null &&
        Number.isFinite(suppliedTaperEnd)
            ? suppliedTaperEnd
            : maxSpeed + REQUIRED_SPEED_MARGIN_KMH;

    if (speedKmh >= finalSpeed) return 0;

    const enteredTaper = Number(train.taper_off ?? 1);

    const taperExponent = Number.isFinite(enteredTaper)
        ? enteredTaper
        : 1;

    // Find the highest resistor reached.
    let reachedIndex = -1;

    for (let i = 0; i < notches.length; i++) {
        if (speedKmh >= notches[i].min_speed) {
            reachedIndex = i;
        } else {
            break;
        }
    }

    if (reachedIndex < 0) return 0;

    // Throttle stages.
    let stageIndex;
    let throttleScale;

    if (throttlePercent < 50) {
        stageIndex = 0;
        throttleScale = 0.5;

    } else if (throttlePercent <= 90) {
        stageIndex = reachedIndex;
        throttleScale = 0.5;

    } else {
        stageIndex = reachedIndex;
        throttleScale = 1;
    }

    const finalIndex = notches.length - 1;
    const startSpeed = notches[stageIndex].min_speed;

    // R1 = 1/3.
    // R2 = 2/3.
    // R3 onwards = full power.
    const startingPower =
        Math.min(1, (stageIndex + 1) / 3) *
        throttleScale;

    const referenceDistance =
        maxSpeed * 0.10 + 5;

    const thirdStart =
        notches[Math.min(2, finalIndex)].min_speed;

    const thirdEndpoint =
        thirdStart + referenceDistance;

    let endpoint;

    // The final notch now reaches the calibrated taper end.
    if (stageIndex === finalIndex) {
        endpoint = finalSpeed;

    } else if (stageIndex === 0) {
        endpoint =
            startSpeed + referenceDistance / 3;

    } else if (stageIndex === 1) {
        endpoint =
            startSpeed + referenceDistance * 2 / 3;

    } else if (stageIndex === 2) {
        endpoint = thirdEndpoint;

    } else {
        const stageProgress =
            (stageIndex - 2) / (finalIndex - 2);

        endpoint =
            thirdEndpoint +
            (finalSpeed - thirdEndpoint) * stageProgress;
    }

    const availableSpeed = endpoint - startSpeed;

    if (availableSpeed <= 0 || speedKmh >= endpoint) {
        return 0;
    }

    const progress =
        (speedKmh - startSpeed) / availableSpeed;

    const remainingPower = Math.pow(
        1 - progress,
        taperExponent
    );

    return startingPower * remainingPower;
}

function VF_control_reset() {
    stopDriveOutput();

    if (soundStarted) {
        try {
            stopSound();
        } catch (error) {
            console.warn("Could not stop sound:", error);
        }

        soundStarted = false;
    }

    simulationEnabled = false;
    simulationPaused = false;

    frequency = 0;
    dcPwmSpeedKmh = 0;
    dcResistorSpeedKmh = 0;

    power = 0;
    acceleration = 0;
    throttle = 0;
    hill = 1;
    lastSpeedKmh = 0;

    throttleSlider.value = "0";
    hillSlider.value = "1";
    hillValue.textContent = "1.00";

    previousFrame = performance.now();

    globalThis.simulated_speed = 0;

    vfErrorLogged = false;

    refreshPulsingHighlight(0);

    statusText.textContent = "Simulation stopped";

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!databaseReady) {
        initialResetRequested = true;
        pendingDriveName = null;
    }

    return true;
}


function VF_control_pause() {
    if (!simulationEnabled) return false;
    if (simulationPaused) return true;

    simulationPaused = true;
    previousFrame = performance.now();

    stopDriveOutput();

    if (soundStarted) {
        try {
            stopSound();
        } catch (error) {
            console.warn("Could not stop sound:", error);
        }

        soundStarted = false;
    }

    statusText.textContent =
        `PAUSED | Speed: ${lastSpeedKmh.toFixed(2)} km/h`;

    return true;
}


function VF_control_resume() {
    if (!simulationEnabled) return false;
    if (!simulationPaused) return true;

    simulationPaused = false;
    previousFrame = performance.now();

    ensureSoundStarted();

    return true;
}


function VF_control_operate(throttle_position, hill_value) {
    const requestedThrottle = Number(throttle_position);
    const requestedHill = Number(hill_value);

    if (
        !Number.isFinite(requestedThrottle) ||
        !Number.isFinite(requestedHill)
    ) {
        return false;
    }

    throttle = clamp(
        requestedThrottle,
        -1,
        1,
        0
    );

    hill = clamp(
        requestedHill,
        0,
        2,
        1
    );

    throttleSlider.value = String(throttle);
    hillSlider.value = String(hill);

    hillValue.textContent = hill.toFixed(2);

    refreshPulsingHighlight(lastSpeedKmh);

    return true;
}


function loadDriveByName(driveName) {
    const key = String(driveName ?? "")
        .trim()
        .toLowerCase();

    if (!key) return false;

    const includedEntry = includedTrainConfigs.get(key);

    if (includedEntry) {
        setTrainTab("included");
        loadSelectedTrain(includedEntry.name);
        return true;
    }

    const userTrain = userTrains.find(
        item => item.name.toLowerCase() === key
    );

    if (userTrain) {
        setTrainTab("user");

        loadEditor(
            userTrain.name,
            structuredClone(userTrain.config)
        );

        return true;
    }

    return false;
}


function VF_control_set_drive(driveName) {
    const name = String(driveName ?? "").trim();

    if (!name) return false;

    // A command may arrive before trains.json has loaded.
    if (!databaseReady) {
        pendingDriveName = name;
        initialResetRequested = false;
        return true;
    }

    const loaded = loadDriveByName(name);

    if (!loaded) {
        console.warn(
            "VF_control_set_drive: train not found:",
            name
        );
    }

    return loaded;
}

// ========================================================
// MAIN SIMULATION LOOP
// ========================================================

function renderDCResistorVisualisation(power) {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    if (width <= 0 || height <= 0) return;

    canvas.width = width;
    canvas.height = height;

    ctx.clearRect(0, 0, width, height);

    const level = clamp(power, 0, 1, 0);

    // Keep the line slightly inside the canvas.
    const padding = height * 0.1;

    // 100% = top, 50% = middle, 0% = bottom.
    const y = padding +
        (height - padding * 2) * (1 - level);

    ctx.beginPath();
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 2;

    ctx.moveTo(0, y);
    ctx.lineTo(width, y);

    ctx.stroke();
}
function renderDCPWMVisualisation(duty, carrierFrequency) {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    if (width <= 0 || height <= 0) return;

    canvas.width = width;
    canvas.height = height;

    ctx.clearRect(0, 0, width, height);

    const dutyCycle = clamp(duty, 0, 1, 0);

    const highY = height * 0.25;
    const lowY = height * 0.75;

    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 2;
    ctx.beginPath();

    // 0%: continuously low.
    if (dutyCycle <= 0) {
        ctx.moveTo(0, lowY);
        ctx.lineTo(width, lowY);

    // 100%: continuously high.
    } else if (dutyCycle >= 1) {
        ctx.moveTo(0, highY);
        ctx.lineTo(width, highY);

    } else {
        // Match the existing render.js time scale:
        // 20,000 samples per second, 4 samples per pixel.
        const visibleSeconds = width * 4 / 20000;

        const frequency = Math.max(
            1,
            Number(carrierFrequency) || 400
        );

        const cycles = Math.max(
            1,
            Math.round(frequency * visibleSeconds)
        );

        const period = width / cycles;

        ctx.moveTo(0, lowY);

        for (let i = 0; i < cycles; i++) {
            const start = i * period;
            const end = (i + 1) * period;
            const highEnd = start + period * dutyCycle;

            ctx.lineTo(start, lowY);
            ctx.lineTo(start, highY);
            ctx.lineTo(highEnd, highY);
            ctx.lineTo(highEnd, lowY);
            ctx.lineTo(end, lowY);
        }
    }

    ctx.stroke();
}



function loop() {
    const now = performance.now();


    // ----------------------------------------------------
    // Simulation disabled.
    // ----------------------------------------------------

    if (!simulationEnabled) {
        previousFrame = now;

        lastSpeedKmh = 0;
        globalThis.simulated_speed = 0;

        statusText.textContent = "Simulation stopped";

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        requestAnimationFrame(loop);
        return;
    }


    // ----------------------------------------------------
    // Simulation paused.
    // ----------------------------------------------------

    if (simulationPaused) {
        previousFrame = now;

        globalThis.simulated_speed = lastSpeedKmh;

        statusText.textContent =
            `PAUSED | Speed: ${lastSpeedKmh.toFixed(2)} km/h`;

        requestAnimationFrame(loop);
        return;
    }


    // ----------------------------------------------------
    // Physics time step.
    // ----------------------------------------------------

    const deltaTime = Math.max(0, now - previousFrame);
    previousFrame = now;

    // Limit each physics update to 100 milliseconds.
    const simulationDeltaTime = Math.min(deltaTime, 100);
    const elapsedSeconds = simulationDeltaTime / 1000;

    throttle = Number(throttleSlider.value);

    const traction = normaliseTraction(currentTrain.traction);
    const controls = currentTrain.controls ?? {};

    const accel = Number(controls.acceleration ?? 2.5);
    const decel = Number(controls.deceleration ?? 3);

    // The actual speed limit is always stated max speed + 6.
    const physicsMaxSpeed = effectiveMaxSpeed;

    let speedKmh = 0;
    let vfData = null;
    let dcPwmPulsingFrequency = 0;

    acceleration = 0;


    // ====================================================
    // DC RESISTOR
    // ====================================================

    if (traction === "DC_RESISTOR") {

        speedKmh = dcResistorSpeedKmh;

        if (throttle > 0) {
            power = getResistorPowerFraction(
                speedKmh,
                currentTrain,
                throttle,
                taperEndSpeed
            );

            acceleration = accel * power;

        } else if (throttle < 0) {
            power = 0;
            acceleration = -decel;

        } else {
            power = 0;
            acceleration = 0;
        }

        // Apply the hill-adjusted resistance after the
        // existing traction/braking calculation.
        acceleration -= getRollingResistanceAcceleration(
            speedKmh,
            currentTrain,
            hill
        );

        dcResistorSpeedKmh +=
            acceleration * elapsedSeconds;

        dcResistorSpeedKmh = clamp(
            dcResistorSpeedKmh,
            0,
            physicsMaxSpeed,
            0
        );

        speedKmh = dcResistorSpeedKmh;


    // ====================================================
    // AC PWM
    // ====================================================

    } else if (traction === "AC_PWM") {

        const speedPerMotorHz =
            calculateSpeedPerMotorHz(currentTrain);

        if (
            !Number.isFinite(speedPerMotorHz) ||
            speedPerMotorHz <= 0
        ) {
            lastSpeedKmh = 0;
            globalThis.simulated_speed = 0;

            statusText.textContent =
                "Frequency: — Hz | Pulsing: — Hz | Power: 0% | " +
                "Speed: 0.00 km/h | Acceleration: 0.00 km/h/s | " +
                "Mode: Invalid AC gear ratio";

            requestAnimationFrame(loop);
            return;
        }

        speedKmh = frequency / speedPerMotorHz;

        const peakPoint =
            Number(currentTrain.peak_point ?? 50);

        let accelerationFactor = 1;

        if (speedKmh > peakPoint) {
            accelerationFactor =
                taperEndSpeed > peakPoint
                    ? clamp(
                        (taperEndSpeed - speedKmh) /
                        (taperEndSpeed - peakPoint),
                        0,
                        1,
                        0
                    )
                    : 0;
        }

        if (throttle > 0) {
            acceleration =
                accelerationFactor *
                accel *
                hill *
                throttle;

        } else if (throttle < 0) {
            // Existing braking formula retained unchanged.
            acceleration = -(
                (decel - accel) +
                (accel * (2 - hill))
            ) * Math.abs(throttle);
        }

        // Apply rolling/wind resistance after the existing
        // acceleration/braking formula.
        acceleration -= getRollingResistanceAcceleration(
            speedKmh,
            currentTrain,
            hill
        );

        power = getPWMpowerFraction(
            speedKmh,
            throttle,
            currentTrain
        );

        if (
            throttle < 0 &&
            speedKmh < Number(currentTrain.decel_cutoff ?? 1)
        ) {
            power = 0;
        }

        frequency +=
            elapsedSeconds *
            acceleration *
            speedPerMotorHz;

        frequency = clamp(
            frequency,
            0,
            physicsMaxSpeed * speedPerMotorHz,
            0
        );

        speedKmh = frequency / speedPerMotorHz;

        try {
            commandVF(
                frequency,
                power,
                simulationDeltaTime
            );

            vfData = getVFData();

        } catch (error) {
            if (!vfErrorLogged) {
                console.warn("AC PWM V/F output error:", error);
                vfErrorLogged = true;
            }
        }


    // ====================================================
    // DC PWM
    // ====================================================

    } else if (traction === "DC_PWM") {

        speedKmh = dcPwmSpeedKmh;

        const peakPoint =
            Number(currentTrain.peak_point ?? 50);

        let accelerationFactor = 1;

        if (speedKmh > peakPoint) {
            accelerationFactor =
                taperEndSpeed > peakPoint
                    ? clamp(
                        (taperEndSpeed - speedKmh) /
                        (taperEndSpeed - peakPoint),
                        0,
                        1,
                        0
                    )
                    : 0;
        }

        if (throttle > 0) {
            acceleration =
                accelerationFactor *
                accel *
                hill *
                throttle;

        } else if (throttle < 0) {
            // Existing braking formula retained unchanged.
            acceleration = -(
                (decel - accel) +
                (accel * (2 - hill))
            ) * Math.abs(throttle);
        }

        // Apply rolling/wind resistance.
        acceleration -= getRollingResistanceAcceleration(
            speedKmh,
            currentTrain,
            hill
        );

        power = getPWMpowerFraction(
            speedKmh,
            throttle,
            currentTrain
        );

        if (
            throttle < 0 &&
            speedKmh < Number(currentTrain.decel_cutoff ?? 1)
        ) {
            power = 0;
        }

        dcPwmSpeedKmh +=
            acceleration * elapsedSeconds;

        dcPwmSpeedKmh = clamp(
            dcPwmSpeedKmh,
            0,
            physicsMaxSpeed,
            0
        );

        speedKmh = dcPwmSpeedKmh;

        // Select the carrier frequency for the current speed.
        dcPwmPulsingFrequency = getActiveDCPWMCarrier(
            speedKmh,
            currentTrain
        );

const dcMotorFrequency = calculateDCMotorRotationHz(
    speedKmh,
    currentTrain
);

if (soundStarted && soundUpdateFunction) {
    soundUpdateFunction({
        mode: "DC-PWM",
        frequency: dcMotorFrequency,
        carrier_frequency: dcPwmPulsingFrequency,
        pulses: 1,
        power: power
    }, simulationDeltaTime);
}
    }

// Send a silent signal through the existing audio engine.
// The existing distortionFactor stage supplies the sound
// for both DC traction modes.
if (
    traction === "DC_RESISTOR" &&
    soundStarted &&
    soundUpdateFunction
) {
    soundUpdateFunction({
        mode: "ASYNC",
        frequency: calculateDCMotorRotationHz(speedKmh, currentTrain),
        carrier_frequency: 400,
        pulses: 1,
        power: 0
    }, simulationDeltaTime);

}
//globalThis.current_motor_frequency = traction === "AC_PWM" ? frequency : calculateDCMotorRotationHz(speedKmh, currentTrain);
    // ====================================================
    // BOTTOM STATUS STRING
    // ====================================================

    lastSpeedKmh = speedKmh;

    // Public speed value for other scripts.
    globalThis.simulated_speed = speedKmh;

    // Show zero braking acceleration once stopped.
    const displayAcceleration =
        speedKmh <= 0 && acceleration < 0
            ? 0
            : acceleration;

    const vfMotorFrequency = vfData?.currentFrequency;
    const vfPulsingFrequency = vfData?.carrierFrequency;
    const vfPower = vfData?.currentPower;

    const displayFrequency = traction === "AC_PWM"
        ? (
            Number.isFinite(Number(vfMotorFrequency))
                ? Number(vfMotorFrequency).toFixed(2)
                : frequency.toFixed(2)
        )
        : "—";

    const displayPulsingFrequency =
        traction === "DC_PWM"
            ? dcPwmPulsingFrequency.toFixed(0)
            : traction === "DC_RESISTOR" ||
              !Number.isFinite(Number(vfPulsingFrequency))
                ? "—"
                : Number(vfPulsingFrequency).toFixed(0);

    const displayPower =
        traction === "DC_RESISTOR" || traction === "DC_PWM"
            ? power
            : (
                Number.isFinite(Number(vfPower))
                    ? Number(vfPower)
                    : power
            );

    let displayMode;

    if (traction === "DC_RESISTOR") {
        displayMode = "DC RESISTOR";

    } else if (traction === "DC_PWM") {
        displayMode = "PWM";

    } else {
        displayMode = vfData?.pulsingMode ?? "—";
    }

    statusText.textContent =
        `Frequency: ${displayFrequency} Hz` +
        ` | Pulsing: ${displayPulsingFrequency} Hz` +
        ` | Power: ${Math.floor(Number(displayPower) * 100)}%` +
        ` | Speed: ${speedKmh.toFixed(2)} km/h` +
        ` | Acceleration: ${displayAcceleration.toFixed(2)} km/h/s` +
        ` | Mode: ${displayMode}`;

    refreshPulsingHighlight(speedKmh);

    if (traction === "DC_RESISTOR") {
    renderDCResistorVisualisation(power);

} else if (traction === "DC_PWM") {
    renderDCPWMVisualisation(
        power,
        dcPwmPulsingFrequency
    );

} else {
    renderVisualisations();
}

    requestAnimationFrame(loop);
}


// ========================================================
// LOAD INCLUDED TRAINS
// ========================================================

async function initialise() {
    try {
        const response = await fetch("./trains.json");

        if (!response.ok) {
            throw new Error(
                `Could not load trains.json (${response.status}).`
            );
        }

        const trainData = await response.json();

        if (
            !trainData ||
            typeof trainData !== "object" ||
            Array.isArray(trainData)
        ) {
            throw new Error(
                "trains.json must contain a train object."
            );
        }

        await setupDatabase(trainData);

        includedTrainConfigs = new Map(
            Object.entries(trainData).map(([name, config]) => [
                name.toLowerCase(),
                { name, config }
            ])
        );

        includedTrains = getAvailableTrains();

        if (!includedTrains.length) {
            throw new Error(
                "No trains were found in trains.json."
            );
        }

        databaseReady = true;

        renderTrainList();
        setTrainTab("included");

        const preferred = "Kiepe Croydon tram (50 mph)";

        const selected = includedTrains.find(
            name => name.toLowerCase() === preferred.toLowerCase()
        ) ?? includedTrains[0];

        // Honour a remote drive command received before
        // the database finished loading.
        const requestedDrive = pendingDriveName;
        pendingDriveName = null;

        if (requestedDrive) {
            const loaded = loadDriveByName(requestedDrive);

            if (!loaded) {
                console.warn(
                    "Requested initial drive was not found:",
                    requestedDrive
                );

                if (!initialResetRequested) {
                    loadSelectedTrain(selected);
                }
            }

        } else if (!initialResetRequested) {
            loadSelectedTrain(selected);

        } else {
            simulationEnabled = false;
            statusText.textContent = "Simulation stopped";
        }

        if (!animationStarted) {
            animationStarted = true;
            previousFrame = performance.now();
            requestAnimationFrame(loop);
        }

    } catch (error) {
        console.error("Database initialisation failed:", error);

        trainListElement.textContent = "Could not load trains.";

        alert(
            "Could not initialise the train database:\n\n" +
            (error.message ?? error)
        );
    }
}


// ========================================================
// LOAD A SELECTED TRAIN
// ========================================================

function loadSelectedTrain(name) {
    if (!name) return;

    const entry = includedTrainConfigs.get(
        name.toLowerCase()
    );

    if (!entry?.config) {
        console.error("Could not find train configuration:", name);
        return;
    }

    loadEditor(
        entry.name,
        structuredClone(entry.config)
    );
}


// ========================================================
// START INITIALISATION
// ========================================================

// Expose the promise so external code can wait for the
// database and initial train list to become ready.
globalThis.VF_control_ready = initialise();


</script>
