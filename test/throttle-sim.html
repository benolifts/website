<title>Train V/F Simulator</title>

<style>
:root{color-scheme:dark;--page:#080808;--panel:#171717;--raised:#222;--border:#454545;--text:#f0efce;--muted:#b9b79c;--accent:#f0dc65;--input:#101010}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--page);color:var(--text);font:14px "Fira Sans",Arial,sans-serif}body{display:flex;flex-direction:column}button,input,select,textarea{font:inherit}button,input,select{accent-color:var(--accent)}button{padding:.35rem .65rem;margin:.12rem .2rem .12rem 0;color:var(--text);background:#303030;border:1px solid #666;border-radius:3px;cursor:pointer}button:hover{background:#424242}button:disabled{opacity:.55;cursor:not-allowed}input,select{min-height:1.8rem;padding:.18rem .35rem;color:var(--text);background:var(--input);border:1px solid #666;border-radius:3px}input[type=number]{width:6.5rem}input[type=range]{padding:0}.app{position:relative;z-index:1;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}.workspace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;flex:1;min-height:0;padding:.7rem;overflow:hidden}.panel{min-width:0;min-height:0;padding:.8rem;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:5px}.panel h2{margin:0 0 .75rem;padding-bottom:.55rem;color:var(--accent);font-size:1.05rem;border-bottom:1px solid var(--border)}.panel h3{margin:1rem 0 .35rem;color:var(--accent);font-size:.95rem}#train-list-panel{display:grid;grid-template-rows:minmax(0,1fr) 148px;gap:.65rem;overflow:hidden}.train-library{display:flex;flex-direction:column;min-height:0;overflow:hidden}.train-library-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}.train-library-header h2{margin:0;padding:0;border:0}.train-library-actions{display:flex;flex-wrap:wrap;gap:.2rem}.train-library-actions button{margin:0}.train-tabs{display:flex;gap:.35rem;margin-top:.55rem}.train-tabs button{flex:1;margin:0}.train-tabs button.active,.train-list-item.active,.traction-options button.active{color:var(--accent);background:#383522;border-color:var(--accent)}#train-list{display:flex;flex:1;flex-direction:column;align-items:stretch;gap:.35rem;min-height:0;margin-top:.6rem;overflow-y:auto}.train-list-item{width:100%;min-height:2.1rem;margin:0;padding:.45rem .6rem;text-align:left;overflow-wrap:anywhere}.driving-controls{display:flex;flex-direction:column;justify-content:space-between;gap:.35rem;height:148px;min-height:148px;padding:.55rem .65rem;overflow:hidden;background:var(--raised);border:1px solid #555;border-radius:5px}.driving-controls-header{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.driving-controls-header h3{margin:0;color:var(--accent);font-size:1rem}.driving-controls-header button{margin:0;padding:.25rem .5rem}.driving-control-row{display:flex;align-items:center;gap:.5rem;min-width:0}.driving-control-row label{flex:0 0 4.1rem;color:var(--muted);font-weight:600}#throttle,#hill{flex:1;width:100%;min-width:0;height:1.65rem}#hill-val{flex:0 0 2.8rem;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}.traction-selector{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.9rem}.traction-label{color:var(--muted);font-weight:600}.traction-options{display:flex;flex-wrap:wrap;gap:.35rem}.traction-options button{flex:1;margin:0}.audio-setting{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.9rem;padding:.45rem 0;border-bottom:1px solid var(--border)}.audio-setting label{color:var(--muted);font-weight:600}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;min-height:2.2rem;margin:.18rem 0}.setting-row>span:first-child{min-width:0;color:var(--muted)}.setting-row input,.setting-row select{flex:0 0 auto}.setting-row[hidden]{display:none!important}.gear-ratio-inputs{display:inline-flex;gap:.35rem;align-items:center}.gear-ratio-inputs input{width:5rem}.calculated-value{min-width:6.5rem;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}.pulsing-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.4rem;margin-bottom:.65rem}.pulsing-header h2{flex:1;margin-bottom:0}#pulsing-config{display:flex;flex-direction:column;gap:.65rem;margin-top:.65rem}.pulsing-element{padding:.7rem;background:var(--raised);border:1px solid #555;border-radius:4px}.pulsing-element .setting-row{gap:.8rem}.pulsing-element .setting-row input,.pulsing-element .setting-row select{width:min(12rem,48%)}.pulsing-element .mode-row select{width:min(15rem,60%)}.pulsing-actions{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}.pulsing-actions button{margin:0}.muted-note{color:var(--muted);font-size:.85rem}canvas{position:relative;z-index:0;display:block;width:100%;height:25vh;flex:0 0 25vh;background:#000}.status-bar{position:relative;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.45rem 1.6rem;min-height:3.6rem;padding:.65rem 1rem;background:rgba(5,5,5,.86);border-top:1px solid #777}#status-text{width:100%;text-align:center;line-height:1.5;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}#text{position:fixed;z-index:20;top:5vh;left:5vw;width:90vw;height:80vh;padding:1rem;overflow:auto;color:var(--text);background:#252525;border:1px solid #777;border-radius:5px;font:13px/1.45 monospace}.buttons{position:fixed;z-index:21;right:5vw;bottom:8vh;display:flex;gap:.4rem}#music-editor-view{position:fixed;z-index:50;inset:0;display:flex;flex-direction:column;padding:.8rem;background:var(--page)}#music-editor-view[hidden]{display:none!important}.music-editor-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:.65rem;border-bottom:1px solid var(--border)}.music-editor-header h2{margin:0;color:var(--accent)}#music-editor-canvas{width:100%;flex:1;min-height:0;margin-top:.75rem;background:#000;border:1px solid var(--border)}@media(max-width:1050px){.workspace{grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;padding:.5rem}.panel{padding:.6rem}.pulsing-element{padding:.5rem}}@media(max-width:620px){.workspace{grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem;padding:.3rem}.panel{padding:.4rem}.panel h2{font-size:.9rem}.train-library-actions{flex-direction:column}.train-library-actions button{font-size:.7rem;padding:.2rem}.setting-row{flex-wrap:wrap;gap:.2rem}.driving-controls{padding:.35rem}.driving-control-row label{flex-basis:2.8rem}.status-bar{justify-content:flex-start;gap:.25rem .6rem;padding:.4rem}#status-text{font-size:.8rem}}
</style>

<body>

<main class="app">
    <section class="workspace">

        <!-- LEFT: TRAIN LIBRARY -->
        <aside class="panel" id="train-list-panel">
            <section class="train-library">
                <div class="train-library-header">
                    <h2>Trains</h2>
                    <div class="train-library-actions">
                        <button id="new" type="button">New Train</button>
                        <button id="save-train" type="button">Save</button>
                        <button id="save" type="button">JSON Editor</button>
                    </div>
                </div>

                <div class="train-tabs">
                    <button id="train-tab-included" class="active" type="button">
                        Included Trains
                    </button>
                    <button id="train-tab-user" type="button">
                        User Trains
                    </button>
                </div>

                <div id="train-list">Loading trains…</div>
            </section>

            <section class="driving-controls" aria-label="Driving controls">
                <div class="driving-controls-header">
                    <h3>Driving Controls</h3>
                    <button id="reset" type="button">Reset Speed</button>
                </div>

                <div class="driving-control-row">
                    <label for="throttle">Throttle</label>
                    <input id="throttle" type="range"
                           min="-1" max="1" step="0.01" value="0">
                </div>

                <div class="driving-control-row">
                    <label for="hill">Hill</label>
                    <input id="hill" type="range"
                           min="0" max="2" step="0.01" value="1">
                    <span id="hill-val">1.00</span>
                </div>
            </section>
        </aside>

        <!-- MIDDLE: TRAIN SETTINGS -->
        <section class="panel" id="train-panel">
            <h2>Train Settings</h2>

            <div class="traction-selector">
                <span class="traction-label">Traction</span>
                <div class="traction-options">
                    <button type="button" data-traction="AC_PWM">AC PWM</button>
                    <button type="button" data-traction="DC_PWM">DC PWM</button>
                    <button type="button" data-traction="DC_RESISTOR">DC Resistor</button>
                </div>
            </div>

            <div class="audio-setting">
                <label for="audio">Audio Mode</label>
                <select id="audio">
                    <option value="48T">48kHz 3 Phase</option>
                    <option value="48S">48kHz Single Phase</option>
                </select>
            </div>

            <div id="train-config"></div>
        </section>

        <!-- RIGHT: PULSING CONFIGURATION -->
        <section class="panel" id="pulsing-panel">
            <div class="pulsing-header">
                <h2>Pulsing Configuration</h2>
                <button id="add-pulsing" type="button">Add Mode</button>
            </div>

            <div class="muted-note">
                Make sure to put these in the order of speed
            </div>

            <div id="pulsing-config"></div>
        </section>
    </section>
</main>

<!-- Dedicated MUSIC editor. -->
<section id="music-editor-view" hidden>
    <div class="music-editor-header">
        <h2>Music Editor</h2>
        <button id="music-editor-back" type="button">Back</button>
    </div>
    <canvas id="music-editor-canvas"></canvas>
</section>

<canvas id="canvas"></canvas>

<div class="status-bar" aria-live="polite">
    <div id="status-text">
        Frequency: — Hz | Pulsing: — Hz | Power: 0% |
        Speed: 0.00 km/h | Acceleration: 0.00 km/h/s | Mode: —
    </div>
</div>

<textarea id="text" hidden aria-label="JSON editor"></textarea>

<script type="module" src="./pulsing.js"></script>
<script type="module" src="./render.js"></script>
<script type="module" src="./sound.js"></script>
<script type="module" src="./interface.js"></script>

<script type="module">

import {
    setupDatabase,
    setTrain,
    commandVF,
    getVFData,
    getAvailableTrains,
    setSoundUpdateFunction
} from "./interface.js";

import {
    setSoundOptions,
    startSound,
    stopSound
} from "./sound.js";

import {
    setCanvas,
    setRenderOptions,
    renderVisualisations
} from "./render.js";


let hide_unnecessary_modes = true;


// ========================================================
// STATE
// ========================================================

let currentTrain = {
    traction: "AC_PWM",
    audio_mode: "48T",
    controls: {},
    pulsing: []
};

let trainName = "";

let frequency = 0;
let dcPwmSpeedKmh = 0;
let dcResistorSpeedKmh = 0;

let power = 0;
let acceleration = 0;
let throttle = 0;
let hill = 1;

let previousFrame = 0;
let animationStarted = false;
let lastSpeedKmh = 0;

let vfErrorLogged = false;
let soundStarted = false;
let soundUpdateFunction = null;

let activeMusicSession = null;

let refreshPulsingHighlight = () => {};

const USER_TRAINS_KEY = "vf-simulator-user-trains-v1";

let includedTrains = [];
let includedTrainConfigs = new Map();

let userTrains = readUserTrains();
let activeTrainTab = "included";

// Automatic maximum-speed calibration.
let effectiveMaxSpeed = 0;
let maxSpeedOffset = 0;
let taperEndSpeed = 0;

const REQUIRED_SPEED_MARGIN_KMH = 6;
const OFFSET_REFERENCE_ROLLING_RESISTANCE = 0.3;

// Remote simulation state.
let simulationEnabled = false;
let simulationPaused = false;

let databaseReady = false;
let pendingDriveName = null;
let initialResetRequested = false;

// Tracks the configuration currently loaded into interface.js.
let interfaceTrainReady = false;
let dcPwmInterfaceCarrier = null;

// Public speed value for other scripts.
globalThis.simulated_speed = 0;


const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const throttleSlider = document.getElementById("throttle");
const resetButton = document.getElementById("reset");
const hillSlider = document.getElementById("hill");
const hillValue = document.getElementById("hill-val");

const audioSelect = document.getElementById("audio");
const displayArea = document.getElementById("text");
const trainListElement = document.getElementById("train-list");

const musicEditorView = document.getElementById("music-editor-view");
const musicEditorCanvas = document.getElementById("music-editor-canvas");
const musicEditorCtx = musicEditorCanvas.getContext("2d");
const musicEditorBack = document.getElementById("music-editor-back");

const statusText = document.getElementById("status-text");


// ========================================================
// GENERAL HELPERS
// ========================================================

function createElement(type, properties = {}, classes = []) {
    const element = Object.assign(
        document.createElement(type),
        properties
    );

    if (typeof classes === "string") {
        classes = classes.split(/\s+/).filter(Boolean);
    }

    if (classes.length) {
        element.classList.add(...classes);
    }

    return element;
}


function createInput(label, input, className = "setting-row") {
    const row = createElement("div", {}, className);

    row.append(
        createElement("span", { textContent: label }),
        input
    );

    return row;
}


function clamp(value, min, max, fallback = min) {
    const number = Number(value);

    return Number.isFinite(number)
        ? Math.max(min, Math.min(max, number))
        : fallback;
}


function lerp(a, b, amount) {
    return a + (b - a) * amount;
}


function normaliseTraction(value) {
    return ["AC_PWM", "DC_PWM", "DC_RESISTOR"].includes(value)
        ? value
        : "AC_PWM";
}


function normaliseAudioMode(value) {
    return value === "48S" ? "48S" : "48T";
}


function isAC(train = currentTrain) {
    return normaliseTraction(train.traction) === "AC_PWM";
}


function isDCPWM(train = currentTrain) {
    return normaliseTraction(train.traction) === "DC_PWM";
}


function isDCResistor(train = currentTrain) {
    return normaliseTraction(train.traction) === "DC_RESISTOR";
}


function parseNumberArray(value) {
    if (Array.isArray(value)) {
        if (!value.length) return null;

        const numbers = value.map(Number);

        return numbers.every(Number.isFinite)
            ? numbers
            : null;
    }

    const text = String(value ?? "").trim();

    if (!text) return null;

    const parts = text.split(",").map(part => part.trim());

    if (parts.some(part => part === "")) return null;

    const numbers = parts.map(Number);

    return numbers.every(Number.isFinite)
        ? numbers
        : null;
}


// ========================================================
// HILL-ADJUSTED ROLLING / WIND RESISTANCE
// ========================================================

// The user's specified formula:
//
// (((2 - hill) * 2) - 1) + rolling_resistance
//
// Hill = 1 is flat track.
// The result is a percentage speed change per second.
//
// The formula is deliberately retained exactly as specified.
function getEffectiveResistancePercent(
    hillValue,
    rollingResistance
) {
    const safeHill = clamp(hillValue, 0, 2, 1);

    const safeRollingResistance = Number.isFinite(
        Number(rollingResistance)
    )
        ? Number(rollingResistance)
        : 0.3;

    return (
        ((2 - safeHill) * 2) - 1
    ) + safeRollingResistance;
}


// Convert a percentage speed change per second into the
// continuous rate used by the simulation.
//
// Positive rate = resistance / slowing down.
// Negative rate = assistance / speeding up.
//
// This makes a speed of 100 lose exactly the specified
// percentage over one second when considered continuously.
function getResistanceRate(percentPerSecond) {
    const fraction = Number(percentPerSecond) / 100;

    if (!Number.isFinite(fraction)) return 0;

    if (fraction >= 1) return Infinity;

    return -Math.log1p(-fraction);
}


// The resistance contribution in km/h per second.
//
// A negative result means the hill is assisting the train.
// At zero speed the contribution is zero.
function getRollingResistanceAcceleration(
    speedKmh,
    train = currentTrain,
    hillValue = hill
) {
    const rawResistance = Number(
        train.rolling_resistance ?? 0.3
    );

    const rollingResistance = Number.isFinite(rawResistance)
        ? rawResistance
        : 0.3;

    const effectiveResistancePercent =
        getEffectiveResistancePercent(
            hillValue,
            rollingResistance
        );

    const rate = getResistanceRate(
        effectiveResistancePercent
    );

    const speed = Math.max(0, Number(speedKmh) || 0);

    if (rate === Infinity) {
        return Infinity;
    }

    return Number.isFinite(rate)
        ? speed * rate
        : 0;
}


// ========================================================
// AUTOMATIC MAXIMUM-SPEED CALIBRATION
// ========================================================

function calculateMaxSpeedOffset(train = currentTrain) {
    const rawMaxSpeed = Number(train.max_speed ?? 120);

    const statedMaxSpeed = Number.isFinite(rawMaxSpeed)
        ? Math.max(0, rawMaxSpeed)
        : 120;

    // The actual speed limit is stated max speed + 6.
    const targetSpeed =
        statedMaxSpeed + REQUIRED_SPEED_MARGIN_KMH;

    const accel = Number(
        train.controls?.acceleration ?? 2.5
    );

    if (
        !Number.isFinite(targetSpeed) ||
        targetSpeed <= 0 ||
        !Number.isFinite(accel) ||
        accel <= 0
    ) {
        return 0;
    }

    // Fixed reference value for calibration.
    // The live user setting does not change this calculation.
    //
    // IMPORTANT:
    // With the specified additive hill formula, flat-track
    // resistance at 0.3 is 1.3%, not 0.3%.
    const referenceResistancePercent =
        getEffectiveResistancePercent(
            1,
            OFFSET_REFERENCE_ROLLING_RESISTANCE
        );

    const referenceRate = getResistanceRate(
        referenceResistancePercent
    );

    const resistanceAtTarget =
        targetSpeed * referenceRate;

    if (
        !Number.isFinite(resistanceAtTarget) ||
        accel <= resistanceAtTarget
    ) {
        return 0;
    }


    // ----------------------------------------------------
    // DC RESISTOR
    //
    // The final notch has its own taper exponent and power.
    // Calibrate the final notch so that its remaining
    // acceleration balances the reference resistance.
    // ----------------------------------------------------

    if (isDCResistor(train)) {
        const notches = (train.pulsing ?? [])
            .filter(item => item.mode === "NOTCH")
            .map(item => ({
                ...item,
                min_speed: Number(item.min_speed ?? 0)
            }))
            .sort((a, b) => a.min_speed - b.min_speed);

        if (!notches.length) return 0;

        const finalIndex = notches.length - 1;

        const finalNotchStart =
            notches[finalIndex].min_speed;

        if (
            !Number.isFinite(finalNotchStart) ||
            finalNotchStart >= targetSpeed
        ) {
            return 0;
        }

        const finalStagePower =
            Math.min(1, (finalIndex + 1) / 3);

        const taperExponent = Number(train.taper_off ?? 1);

        if (
            !Number.isFinite(taperExponent) ||
            taperExponent <= 0
        ) {
            return 0;
        }

        const maximumFinalNotchAcceleration =
            accel * finalStagePower;

        if (
            maximumFinalNotchAcceleration <= resistanceAtTarget
        ) {
            return 0;
        }

        const requiredPowerRatio =
            resistanceAtTarget /
            maximumFinalNotchAcceleration;

        const taperRatio = Math.pow(
            requiredPowerRatio,
            1 / taperExponent
        );

        if (
            !Number.isFinite(taperRatio) ||
            taperRatio <= 0 ||
            taperRatio >= 1
        ) {
            return 0;
        }

        return (
            taperRatio *
            (targetSpeed - finalNotchStart) /
            (1 - taperRatio)
        );
    }


    // ----------------------------------------------------
    // AC PWM AND DC PWM
    //
    // The acceleration tapers linearly from peak_point
    // to the calculated taper endpoint.
    // ----------------------------------------------------

    const peakPoint = Number(train.peak_point ?? 50);

    if (
        !Number.isFinite(peakPoint) ||
        targetSpeed <= peakPoint
    ) {
        return 0;
    }

    return (
        resistanceAtTarget *
        (targetSpeed - peakPoint) /
        (accel - resistanceAtTarget)
    );
}


// Recalculate the speed limit and taper endpoint whenever
// a train is loaded or a relevant setting changes.
function updateMaxSpeedCalibration() {
    const rawMaxSpeed = Number(currentTrain.max_speed ?? 120);

    const statedMaxSpeed = Number.isFinite(rawMaxSpeed)
        ? Math.max(0, rawMaxSpeed)
        : 120;

    effectiveMaxSpeed =
        statedMaxSpeed + REQUIRED_SPEED_MARGIN_KMH;

    maxSpeedOffset = calculateMaxSpeedOffset(currentTrain);

    taperEndSpeed =
        effectiveMaxSpeed + maxSpeedOffset;
}


// ========================================================
// AC PWM SPEED CONVERSION ONLY
// ========================================================

function calculateSpeedPerMotorHz(train) {
    if (!isAC(train)) return NaN;

    const wheel = Number(train.wheel_diameter);
    const poles = Number(train.motor_poles ?? 4);
    const motorSide = Number(train.gear_ratio_motor_side);
    const wheelSide = Number(train.gear_ratio_wheel_side);

    if (
        !Number.isFinite(wheel) || wheel <= 0 ||
        !Number.isFinite(poles) || poles <= 0 || poles % 2 !== 0 ||
        !Number.isFinite(motorSide) || motorSide <= 0 ||
        !Number.isFinite(wheelSide) || wheelSide <= 0
    ) {
        return NaN;
    }

    return (poles * motorSide / wheelSide) /
        (7.2 * Math.PI * wheel);
}
function calculateDCMotorRotationHz(speedKmh, train = currentTrain) {
    const wheel = Number(train.wheel_diameter);
    const motorSide = Number(train.gear_ratio_motor_side);
    const wheelSide = Number(train.gear_ratio_wheel_side);

    const motorPoles = 4;

    if (
        !Number.isFinite(wheel) || wheel <= 0 ||
        !Number.isFinite(motorSide) || motorSide <= 0 ||
        !Number.isFinite(wheelSide) || wheelSide <= 0
    ) {
        return 0;
    }

    const speed = Number.isFinite(Number(speedKmh))
        ? Math.max(0, Number(speedKmh))
        : 0;

    return (
        speed * motorPoles * motorSide
    ) / (
        7.2 * Math.PI * wheel * wheelSide
    );
}

// ========================================================
// PWM POWER SETTINGS
// ========================================================

function normalisePowerControls(raw = {}, traction = currentTrain.traction) {
    const controls = {
        ...(raw && typeof raw === "object" ? raw : {})
    };

    controls.acceleration = clamp(
        controls.acceleration,
        0,
        100,
        2.5
    );

    controls.deceleration = clamp(
        controls.deceleration,
        0,
        100,
        3
    );

    if (traction === "DC_RESISTOR") {
        for (const key of [
            "min_power",
            "max_power",
            "initial_min_power",
            "initial_max_power",
            "peak_min_power",
            "peak_max_power"
        ]) {
            delete controls[key];
        }

        return controls;
    }

    const hasNewPowerFields = [
        "initial_min_power",
        "peak_min_power",
        "peak_max_power"
    ].some(key => controls[key] != null);

    function legacyPercent(value, fallback) {
        if (value == null || value === "") return fallback;

        const number = Number(value);

        if (!Number.isFinite(number)) return fallback;

        return number > 0 && number <= 1
            ? number * 100
            : number;
    }

    const initialMin = hasNewPowerFields
        ? (controls.initial_min_power ?? 10)
        : legacyPercent(controls.min_power, 10);

    const initialMax = hasNewPowerFields
        ? (controls.initial_max_power ?? 20)
        : legacyPercent(controls.initial_max_power, 20);

    const peakMin = hasNewPowerFields
        ? (controls.peak_min_power ?? 10)
        : legacyPercent(controls.min_power, 10);

    const peakMax = hasNewPowerFields
        ? (controls.peak_max_power ?? 100)
        : legacyPercent(controls.max_power, 100);

    controls.initial_min_power = clamp(initialMin, 0, 100, 10);
    controls.initial_max_power = clamp(initialMax, 0, 100, 20);
    controls.peak_min_power = clamp(peakMin, 0, 100, 10);
    controls.peak_max_power = clamp(peakMax, 0, 100, 100);

    controls.initial_max_power = Math.max(
        controls.initial_min_power,
        controls.initial_max_power
    );

    controls.peak_max_power = Math.max(
        controls.peak_min_power,
        controls.peak_max_power
    );

    delete controls.min_power;
    delete controls.max_power;

    return controls;
}


function getPWMpowerFraction(speedKmh, throttleAmount, train = currentTrain) {
    const amount = Math.abs(Number(throttleAmount));

    if (amount <= 0) return 0;

    const controls = train.controls ?? {};

    const throttleProgress = clamp(
        (amount - 0.01) / 0.99,
        0,
        1,
        0
    );

    const peakPoint = Math.max(
        0.001,
        Number(train.peak_point ?? 50)
    );

    const speedProgress = clamp(
        Number(speedKmh) / peakPoint,
        0,
        1,
        0
    );

    const initialPower = lerp(
        Number(controls.initial_min_power ?? 10),
        Number(controls.initial_max_power ?? 20),
        throttleProgress
    );

    const peakPower = lerp(
        Number(controls.peak_min_power ?? 10),
        Number(controls.peak_max_power ?? 100),
        throttleProgress
    );

    return clamp(
        lerp(initialPower, peakPower, speedProgress) / 100,
        0,
        1,
        0
    );
}

function getPulsingSchema(train = currentTrain) {
    if (isDCPWM(train)) return DC_PWM_SCHEMA;
    if (isDCResistor(train)) return DC_RESISTOR_SCHEMA;
    return AC_SCHEMA;
}


function getActiveFields(config, schemaSet = getPulsingSchema()) {
    const schema = schemaSet[config.mode];

    if (!schema) return [];

    const fields = [...schema.fields];

    if (
        config.mode === "ASYNC-OSCILLATING" &&
        config.oscillation_mode === "RANDOM"
    ) {
        return fields.filter(key => key !== "oscillation_frequency");
    }

    return fields;
}


// ========================================================
// NORMALISE PULSING CONFIGURATION
// ========================================================

function normalisePulsingConfig(raw = {}, train = currentTrain) {
    if (
        !raw ||
        typeof raw !== "object" ||
        Array.isArray(raw)
    ) {
        raw = {};
    }

    const source = { ...raw };
    const schemaSet = getPulsingSchema(train);
    const modes = Object.keys(schemaSet);

    const mode = modes.includes(source.mode)
        ? source.mode
        : modes[0];

    const schema = schemaSet[mode];
    const result = { mode };

    const factor = calculateSpeedPerMotorHz(train);

    if (
        mode !== "ASYNC-MUSIC" &&
        source.min_speed == null &&
        source.min_motor_frequency != null &&
        Number.isFinite(factor) &&
        factor > 0
    ) {
        source.min_speed =
            Number(source.min_motor_frequency) / factor;
    }

    if (
        mode === "ASYNC-MUSIC" &&
        source.min_motor_frequency == null
    ) {
        source.min_motor_frequency =
            source.min_speed != null &&
            Number.isFinite(factor) &&
            factor > 0
                ? Number(source.min_speed) * factor
                : schema.defaults.min_motor_frequency;
    }

    if (mode === "ASYNC-OSCILLATING") {
        const waveform =
            source.oscillation_mode ??
            schema.defaults.oscillation_mode;

        result.oscillation_mode =
            OSCILLATION_MODES.includes(waveform)
                ? waveform
                : schema.defaults.oscillation_mode;
    }

    for (const key of getActiveFields(result, schemaSet)) {
        if (key === "oscillation_mode") continue;

        const def = FIELD_DEFINITIONS[key];
        let value = source[key];

        if (def.type === "array") {
            const parsed = parseNumberArray(value);

            result[key] = parsed?.length
                ? parsed
                : [...schema.defaults[key]];

            continue;
        }

        if (value == null || value === "") {
            value = schema.defaults[key];
        }

        const number = Number(value);

        result[key] =
            Number.isFinite(number) &&
            number >= (def.min ?? -Infinity) &&
            number <= (def.max ?? Infinity)
                ? number
                : schema.defaults[key];
    }

    return result;
}


function serialisePulsingConfig(config) {
    return normalisePulsingConfig(config, currentTrain);
}


// ========================================================
// TRANSITION BETWEEN PULSING MODES
// ========================================================

function transitionPulsingConfig(previous, newMode) {
    const old = normalisePulsingConfig(previous);
    const schemaSet = getPulsingSchema();

    if (!schemaSet[newMode]) return old;

    const oldFields = schemaSet[old.mode].fields;
    const newFields = schemaSet[newMode].fields;

    const next = { mode: newMode };

    for (const key of newFields) {
        if (
            oldFields.includes(key) &&
            Object.hasOwn(old, key)
        ) {
            next[key] = Array.isArray(old[key])
                ? [...old[key]]
                : old[key];
        }
    }

    const factor = calculateSpeedPerMotorHz(currentTrain);

    if (newMode === "ASYNC-MUSIC" && old.min_speed != null) {
        next.min_motor_frequency =
            Number.isFinite(factor) && factor > 0
                ? old.min_speed * factor
                : 0;
    }

    if (old.mode === "ASYNC-MUSIC" && newMode !== "ASYNC-MUSIC") {
        next.min_speed =
            Number.isFinite(factor) && factor > 0
                ? old.min_motor_frequency / factor
                : 0;
    }

    const isRangeMode = mode =>
        mode === "ASYNC-OSCILLATING" ||
        mode === "ASYNC-SWEEP";

    if (isRangeMode(newMode)) {
        if (isRangeMode(old.mode)) {
            next.min_carrier_frequency =
                old.min_carrier_frequency;

            next.max_carrier_frequency =
                old.max_carrier_frequency;
        } else {
            const carrier = old.carrier_frequency ?? 400;

            next.min_carrier_frequency =
                Math.max(0, carrier - 50);

            next.max_carrier_frequency =
                carrier + 50;
        }
    }

    if (newMode === "ASYNC") {
        next.carrier_frequency = isRangeMode(old.mode)
            ? (
                old.min_carrier_frequency +
                old.max_carrier_frequency
            ) / 2
            : (old.carrier_frequency ?? 400);
    }

    return normalisePulsingConfig(next);
}

// ========================================================
// INTERFACE.JS COMPATIBILITY
// ========================================================

// interface.js supports these AC pulsing modes.
const INTERFACE_AC_MODES = new Set([
    "ASYNC",
    "ASYNC-OSCILLATING",
    "ASYNC-SWEEP",
    "ASYNC-MUSIC",
    "SYNC",
    "SHE-PWM",
    "ASYNC-STEP",
    "AUTO-SYNC"
]);


// Make a safe AC configuration for interface.js.
//
// MUSIC remains in the local train configuration and editor,
// but is not passed to an interface that does not support it.
function getACInterfaceTrain(train) {
    const interfaceTrain = structuredClone(train);

    interfaceTrain.pulsing = (
        Array.isArray(train.pulsing)
            ? train.pulsing
            : []
    ).filter(config =>
        INTERFACE_AC_MODES.has(config.mode)
    );

    // interface.js requires at least one pulsing entry.
    if (!interfaceTrain.pulsing.length) {
        interfaceTrain.pulsing = [
            {
                mode: "ASYNC",
                min_speed: 0,
                carrier_frequency: 400
            }
        ];
    }

    return interfaceTrain;
}


// Select the DC PWM carrier entry active at a given speed.
// This is independent of the order in which entries were saved.
function getActiveDCPWMCarrier(speedKmh, train = currentTrain) {
    const matching = (train.pulsing ?? [])
        .filter(config =>
            config.mode === "PWM" &&
            Number(config.min_speed ?? 0) <= speedKmh
        )
        .sort((a, b) =>
            Number(a.min_speed ?? 0) -
            Number(b.min_speed ?? 0)
        );

    if (!matching.length) {
        return 400;
    }

    const carrier = Number(
        matching[matching.length - 1].carrier_frequency ?? 400
    );

    return Number.isFinite(carrier)
        ? Math.max(0, carrier)
        : 400;
}


// interface.js does not know the custom DC PWM mode.
//
// It can, however, output the required carrier frequency
// and power through its existing ASYNC mode.
//
// Motor frequency is set to zero. The ASYNC configuration
// supplies the carrier frequency to the pulsing engine.
function configureDCPWMInterface(carrierFrequency) {
    const carrier = Number.isFinite(Number(carrierFrequency))
        ? Math.max(0, Number(carrierFrequency))
        : 400;

    if (
        interfaceTrainReady &&
        dcPwmInterfaceCarrier === carrier
    ) {
        return true;
    }

    try {
        setTrain({
            speed_per_motor_hz: 1,

            pulsing: [
                {
                    mode: "ASYNC",
                    min_motor_frequency: 0,
                    max_motor_frequency: 1000,
                    carrier_frequency: carrier
                }
            ]
        });

        interfaceTrainReady = true;
        dcPwmInterfaceCarrier = carrier;

        return true;

    } catch (error) {
        interfaceTrainReady = false;
        dcPwmInterfaceCarrier = null;

        console.warn(
            "DC PWM interface configuration failed:",
            error
        );

        return false;
    }
}


// ========================================================
// STOP CURRENT INTERFACE OUTPUT
// ========================================================

function stopDriveOutput() {
    if (!interfaceTrainReady) return;

    try {
        commandVF(0, 0, 16);
    } catch (error) {
        console.warn("Could not stop V/F output:", error);
    }
}


// ========================================================
// APPLY CONFIGURATION TO VF
// ========================================================

function loadTrainToSim() {
    currentTrain.pulsing = (
        Array.isArray(currentTrain.pulsing)
            ? currentTrain.pulsing
            : []
    ).map(config =>
        normalisePulsingConfig(config, currentTrain)
    );

    // Recalculate maximum-speed taper for this train.
    updateMaxSpeedCalibration();

    if (isAC()) {
        const factor = calculateSpeedPerMotorHz(currentTrain);

        if (Number.isFinite(factor) && factor > 0) {
            currentTrain.speed_per_motor_hz = factor;
        } else {
            delete currentTrain.speed_per_motor_hz;
        }

        const display = document.getElementById("speed-per-motor-hz");

        if (display) {
            display.textContent =
                Number.isFinite(factor) && factor > 0
                    ? factor.toFixed(4)
                    : "Invalid gear ratio";
        }

        try {
            setTrain(getACInterfaceTrain(currentTrain));

            interfaceTrainReady = true;
            dcPwmInterfaceCarrier = null;
            vfErrorLogged = false;

        } catch (error) {
            interfaceTrainReady = false;

            console.warn("AC PWM V/F setup failed:", error);
        }

        return;
    }


    // ----------------------------------------------------
    // DC PWM
    // ----------------------------------------------------

    if (isDCPWM()) {
        delete currentTrain.speed_per_motor_hz;

        const carrier = getActiveDCPWMCarrier(
            lastSpeedKmh,
            currentTrain
        );

        configureDCPWMInterface(carrier);

        vfErrorLogged = false;

        return;
    }


    // ----------------------------------------------------
    // DC RESISTOR
    // ----------------------------------------------------

    delete currentTrain.speed_per_motor_hz;

    interfaceTrainReady = false;
    dcPwmInterfaceCarrier = null;


}


// ========================================================
// PULSING START SPEED AND HIGHLIGHT
// ========================================================

function getPulsingStartSpeed(config) {
    if (config.mode === "ASYNC-MUSIC") {
        const factor = calculateSpeedPerMotorHz(currentTrain);

        return Number.isFinite(factor) && factor > 0
            ? Number(config.min_motor_frequency ?? 0) / factor
            : 0;
    }

    return Number(config.min_speed ?? 0);
}


function getInheritedStartSpeed(items, insertIndex) {
    for (let i = insertIndex - 1; i >= 0; i--) {
        const speed = getPulsingStartSpeed(items[i].config);

        if (Number.isFinite(speed)) return speed;
    }

    return 0;
}


function setPulsingHighlight(items, speedKmh) {
    items.forEach(item => {
        item.element.style.backgroundColor = "";
        item.element.style.borderColor = "";
    });

    if (Math.abs(Number(throttleSlider.value)) < 0.000001) {
        return;
    }

    for (let i = 0; i < items.length; i++) {
        const start = getPulsingStartSpeed(items[i].config);

        const nextStart = i + 1 < items.length
            ? getPulsingStartSpeed(items[i + 1].config)
            : Infinity;

        if (speedKmh >= start && speedKmh < nextStart) {
            items[i].element.style.backgroundColor = "#302f25";
            items[i].element.style.borderColor = "#756b40";
            break;
        }
    }
}

// TRAIN EDITOR
// ========================================================

function loadEditor(name, trainConfig) {
    // Stop the previous interface output before replacing
    // the current train configuration.
    stopDriveOutput();

    trainName = name;

    currentTrain =
        trainConfig &&
        typeof trainConfig === "object" &&
        !Array.isArray(trainConfig)
            ? structuredClone(trainConfig)
            : {};

    currentTrain.traction = normaliseTraction(currentTrain.traction);

    currentTrain.audio_mode = normaliseAudioMode(
        currentTrain.audio_mode ?? currentTrain.audio
    );

    delete currentTrain.audio;
    delete currentTrain.speed_per_motor_hz;

    currentTrain.wheel_diameter ??= 0.84;
    currentTrain.gear_ratio_motor_side ??= 6;
    currentTrain.gear_ratio_wheel_side ??= 1;
    currentTrain.max_speed ??= 120;
    currentTrain.rolling_resistance ??= 0.3;

    if (isDCResistor()) {
        delete currentTrain.motor_poles;
        delete currentTrain.peak_point;
        delete currentTrain.decel_cutoff;

        currentTrain.taper_off ??= 1;

    } else {
        currentTrain.peak_point ??= 50;
        currentTrain.decel_cutoff ??= 1;

        delete currentTrain.taper_off;

        if (isAC()) {
            currentTrain.motor_poles ??= 4;
        } else {
            delete currentTrain.motor_poles;
        }
    }

    currentTrain.controls = normalisePowerControls(
        currentTrain.controls ?? {},
        currentTrain.traction
    );

    currentTrain.pulsing = Array.isArray(currentTrain.pulsing)
        ? currentTrain.pulsing
        : [];

    currentTrain.pulsing = currentTrain.pulsing.map(config =>
        normalisePulsingConfig(config, currentTrain)
    );


    // ----------------------------------------------------
    // Reset each traction type's speed.
    // Reset hill and its slider whenever a train is loaded.
    // ----------------------------------------------------

    frequency = 0;
    dcPwmSpeedKmh = 0;
    dcResistorSpeedKmh = 0;

    power = 0;
    acceleration = 0;
    throttle = 0;
    hill = 1;
    lastSpeedKmh = 0;

    simulationEnabled = true;
    simulationPaused = false;

    previousFrame = performance.now();

    globalThis.simulated_speed = 0;

    throttleSlider.value = "0";
    hillSlider.value = "1";
    hillValue.textContent = "1.00";

applyAudioMode(currentTrain.audio_mode);

if (soundStarted) {
    restartSound();
}

    const editor = document.getElementById("train-config");
    const pulsingEditor = document.getElementById("pulsing-config");

    editor.replaceChildren();
    pulsingEditor.replaceChildren();

    refreshPulsingHighlight = () => {};

    setActiveTrain(trainName);


    // ----------------------------------------------------
    // Number setting helper.
    // ----------------------------------------------------

    function addNumberSetting(
        parent,
        label,
        target,
        key,
        options = {}
    ) {
        const input = createElement("input", {
            type: "number",
            step: options.step ?? 1,
            min: options.min ?? "",
            max: options.max ?? "",
            value: target[key] ?? ""
        });

        input.addEventListener("change", () => {
            const value = input.valueAsNumber;

            if (
                !Number.isFinite(value) ||
                value < (options.min ?? -Infinity) ||
                value > (options.max ?? Infinity)
            ) {
                input.value = target[key];
                return;
            }

            target[key] = value;
            loadTrainToSim();
        });

        parent.appendChild(createInput(label, input));
        return input;
    }


    // ----------------------------------------------------
    // Train name.
    // ----------------------------------------------------

    const nameInput = createElement("input", {
        id: "train-name",
        type: "text",
        value: trainName
    });

    nameInput.addEventListener("change", () => {
        trainName = nameInput.value.trim();
        setActiveTrain(trainName);
    });

    editor.appendChild(createInput("Name", nameInput));


    // ----------------------------------------------------
    // Mechanical settings.
    // ----------------------------------------------------

    addNumberSetting(
        editor,
        "Wheel Diameter (m)",
        currentTrain,
        "wheel_diameter",
        { step: 0.01, min: 0.1 }
    );

    if (isAC()) {
        addNumberSetting(
            editor,
            "Motor Poles",
            currentTrain,
            "motor_poles",
            { step: 2, min: 2 }
        );
    }

    const motorRatio = createElement("input", {
        type: "number",
        step: 0.1,
        min: 0.1,
        value: currentTrain.gear_ratio_motor_side
    });

    const wheelRatio = createElement("input", {
        type: "number",
        step: 0.1,
        min: 0.1,
        value: currentTrain.gear_ratio_wheel_side
    });

    const ratioContainer = createElement(
        "span",
        {},
        ["gear-ratio-inputs"]
    );

    ratioContainer.append(
        motorRatio,
        document.createTextNode(":"),
        wheelRatio
    );

    function updateGearRatio() {
        const motor = motorRatio.valueAsNumber;
        const wheel = wheelRatio.valueAsNumber;

        if (
            !Number.isFinite(motor) || motor <= 0 ||
            !Number.isFinite(wheel) || wheel <= 0
        ) {
            motorRatio.value = currentTrain.gear_ratio_motor_side;
            wheelRatio.value = currentTrain.gear_ratio_wheel_side;
            return;

// ========================================================
// MUSIC EDITOR
