            }else if (((event.key.toLowerCase() === "q") && (flip_out)) || ((event.key.toLowerCase() === "e") && (!flip_out))){
                if (right_doors_mode == 0){right_doors_mode = 1}else if (right_doors_mode == 2){right_doors_mode = (0 - (the_time + (door_alarm*1000)))}else if (right_doors_mode < 0){right_doors_mode = 2}else if (right_doors_mode == 4){right_doors_mode = 1}
            } else if (event.key.toLowerCase() === "w") {
                // Increment reverser, capping it at a maximum of 1
                if (flip_out){reverser--}else{reverser++}if (reverser>1){reverser=1}if (reverser<-1){reverser=-1}
            } else if (event.key.toLowerCase() === "s") {
                if (flip_out){reverser++}else{reverser--}if (reverser>1){reverser=1}if (reverser<-1){reverser=-1}

                if(event.key.toLowerCase() === "p") {
                    changepoints(pos, 1);

                } else if (event.key.toLowerCase() === "o") {
                    changepoints(pos, 2);

                    changepoints(pos-(adjusted_train_length), -1);

                } else if (event.key.toLowerCase() === "o") {
                    changepoints(pos-(adjusted_train_length), -2);

                } else if (event.key.toLowerCase() === "i") {
                    changepoints(pos-(adjusted_train_length), -3);

                } else if (event.key.toLowerCase() === "u") {
                    changepoints(pos-(adjusted_train_length), -4);

}, true);

function changepoints(pos, next_number) {
    var q = -1;

    if (next_number > 0) {
        for (var i = 0; i < current_route_items_detailed.length; i++) {
            if (current_route_items_detailed[i][1] <= pos) {
                q = i;
            } else {
                break;
            }
        }
    } else if (next_number < 0) {
        q = current_route_items_detailed.length;

        for (var i = 0; i < current_route_items_detailed.length; i++) {
            if (current_route_items_detailed[i][1] >= pos) {
                q = i;
                break;
            }
        }
    } else {
        return;
    }

    q += next_number;

    if (q < 0 || q >= current_route_items_detailed.length) return;

    if (
        current_route_items_detailed[q][0] !== "facingpoints" &&
        current_route_items_detailed[q][0] !== "nonfacingpoints" &&
        current_route_items_detailed[q][0] !== "conflictingpoints"
    ) return;

    var id = current_route_items_detailed[q][4];

    if (!Number.isInteger(id) || !trackSwitches[id]) return;

    trackSwitches[id][4] = !trackSwitches[id][4];

    updatepoints();
    populateCurrentRouteItems();
}

            : null;

        selectedCoachCount === routePreferredCount

    if (
        trainPreferredCount !== null &&
        selectedCoachCount === trainPreferredCount
    ) {
        notes.push(

function saveRouteSettingsToCookie() {
    try {
        var settings = {
            DRAW_AHEAD: Number(DRAW_AHEAD),
            lock_mouse: lock_mouse === true,
            prefer_sound: prefer_sound,
            prefer_units: prefer_units
        };

        document.cookie =
            "vf_train_sim_settings=" +
            encodeURIComponent(JSON.stringify(settings)) +
            "; max-age=31536000; path=/; SameSite=Lax";
    } catch (error) {
        // Cookie saving is optional; leave the current settings in use.
    }
}

function loadRouteSettingsFromCookie() {
    try {
        var cookieValue = null;

        document.cookie.split(";").some(function (cookie) {
            var separator = cookie.indexOf("=");
            if (separator === -1) return false;

            var name = cookie.slice(0, separator).trim();

            if (name === "vf_train_sim_settings") {
                cookieValue = cookie.slice(separator + 1).trim();
                return true;
            }

            return false;
        });

        if (cookieValue === null) return;

        var settings = JSON.parse(decodeURIComponent(cookieValue));

        if (
            typeof settings.DRAW_AHEAD === "number" &&
            Number.isFinite(settings.DRAW_AHEAD)
        ) {
            DRAW_AHEAD = settings.DRAW_AHEAD;
        }

        if (typeof settings.lock_mouse === "boolean") {
            lock_mouse = settings.lock_mouse;
        }
        if (typeof settings.prefer_sound === "number") {
            prefer_sound = settings.prefer_sound;
        }
        if (typeof settings.prefer_units === "number") {
            prefer_units = settings.prefer_units;
        }




    } catch (error) {
        // Invalid or unavailable cookies leave the default settings unchanged.
    }
}

    var direction = forward ? 1 : reverse ? -1 : 0;
    var i, item, d, minD = Infinity, maxD = -Infinity, upcoming = [];
    var p = pos;


    var coachCount = (coaches);
    var coachLength = (coachlength);


    var trainLength = train_length;
    var routePosition = reverse ? p - trainLength : p;

    ctx.clearRect(0, 0, w, h);

    for (i = 0; i < items.length; i++) {
        item = items[i];
        if (!Array.isArray(item)) continue;
        d = Number(item[1]);
        if (!Number.isFinite(d)) continue;
        if (d < minD) minD = d;
        if (d > maxD) maxD = d;
    }

    var startBuffer = Infinity, endBuffer = -Infinity;

    for (i = 0; i < items.length; i++) {
        item = items[i];
        if (!Array.isArray(item) || item[0] !== 'buffer') continue;
        d = Number(item[1]);
        if (!Number.isFinite(d)) continue;
        if (Math.abs(d - minD) < 0.01) startBuffer = d;
        if (Math.abs(d - maxD) < 0.01) endBuffer = d;
    }

    // The global crash record persists; diagramCrashed is recalculated each frame.
    var diagramCrashed = false;





if (forward) {
    if (pos > (items[items.length - 1][1])) {
        crashed = true;
        crashedtext = 'Crashed into buffer';
        diagramCrashed = true;
    }
} else if (reverse) {
    if (pos - train_length < (items[0][1])) {
        crashed = true;
        crashedtext = 'Crashed into buffer';
        diagramCrashed = true;
    }
}

    var panelX = w * 0.8, panelW = w * 0.2;

    if (Number(reverser) === 0) {
        ctx.fillStyle = '#101925';
        ctx.fillRect(panelX, 0, panelW, h);
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Reverser is in neutral', panelX + panelW / 2, h / 2);

        if (diagramCrashed) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(panelX + 3, h * 0.40, panelW - 6, h * 0.20);
            ctx.fillStyle = '#ff3030';
            ctx.font = '900 ' + Math.min(38, panelW * 0.18) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CRASHED!', panelX + panelW / 2, h * 0.5);
        }

        return;
    }

    if (!forward && !reverse) return;

    for (
        i = forward ? 0 : items.length - 1;
        forward ? i < items.length && upcoming.length < 4 : i >= 0 && upcoming.length < 4;
        forward ? i++ : i--
    ) {

async function launchDeveloperRoute(filename, story) {
    var routeIndex = findRouteIndexByFilename(filename);

    var routeData = story
        ? story
        : routeIndex >= 0
            ? getRouteList()[routeIndex]
            : null;

    if (!routeData || !routeData.fileName) {
        menuMessage = story
            ? "The story does not have a valid filename."
            : 'Developer shortcut "' + filename +
                '" could not be found in the loaded route JSON.';

        console.error(menuMessage);

        renderRouteMenu(story ? 100 : 0);
        return;
    }

    // Stories supply the developer settings.
    if (story) {
        if (story.developer_train != null) {
            developer_train = story.developer_train;
        }

        if (story.developer_vf != null) {
            developer_vf = story.developer_vf;
        }

        if (story.developer_livery != null) {
            developer_livery = story.developer_livery;
        }

        if (story.developer_coaches != null) {
            developer_coaches = story.developer_coaches;
        }
    }

    // Use the story itself as the selected route configuration.
    selectedStory = story || null;

    routeLaunchSource = "developer";

    selectedRouteIndex = routeIndex;

    selectedCategory = String(routeData.category || "");
    selectedSubcategory = String(routeData.subcategory || "");

    selectedCoachCount = story
        ? clampCoachCount(developer_coaches)
        : clampCoachCount(routeData.preferredCoaches || 1);

    selectedWeather = defaultWeatherForRoute(routeData);

    // Set the same variables used by developer quick-access.
    current_train = developer_train;
    current_livery = developer_livery;
    current_vf = developer_vf;

    coaches = clampCoachCount(developer_coaches);
    coachCountForCurrentLaunch = coaches;

    globalThis.routeWeatherSelection =
        makeWeatherSelection(routeData, selectedWeather);

    closeRouteMenuForLaunch();

    statusElement.textContent =
        story
            ? "Story: loading " + (routeData.name || filename) + "..."
            : "Developer shortcut: loading " +
                (routeData.name || filename) + "...";

    // Pass the story object through so its scripts and settings
    // are used by the simulator.
    await start_sim(routeIndex, story || null);

    if (!activeRoute) {
        var errorMessage = statusElement.textContent;
        var returnStage = story ? 100 : 0;

        main_menu(returnStage);
        menuMessage = errorMessage;
        renderRouteMenu(returnStage);
    }
}

function getTrainDatabaseList() {
    return typeof list_of_trains !== "undefined" &&
        Array.isArray(list_of_trains)
            ? list_of_trains
            : [];
}


function getMenuTrainEntries(includeAll) {
    var trains = getTrainDatabaseList().filter(function (train) {
        return train &&
            typeof train.name === "string" &&
            train.name.trim() !== "";
    });

    // Initially, only show trains listed by the selected route.
    if (!includeAll) {
        var selectedRoute = getSelectedRoute();

        var preferredNames =
            selectedRoute &&
            Array.isArray(selectedRoute.preferredTrains)
                ? selectedRoute.preferredTrains
                : [];

        var preferredSet = new Set(
            preferredNames.map(function (name) {
                return String(name).trim().toLowerCase();
            })
        );

        // A preferred train is only shown if it exists
        // in list_of_trains.
        trains = trains.filter(function (train) {
            return preferredSet.has(
                train.name.trim().toLowerCase()
            );
        });
    }

    // Remove duplicate train names.
    var seen = new Set();

    trains = trains.filter(function (train) {
        var key = train.name.trim().toLowerCase();

        if (seen.has(key)) return false;

        seen.add(key);
        return true;
    });

    // Alphabetical order, ignoring capitalisation.
    return trains.sort(function (a, b) {
        return compareMenuNames(a.name, b.name);
    });
}

function getTrainLiveryEntries(train) {
    if (!train) return [];

    // Use the field from your supplied trains database.
    var liveries = train.preferedLivery;

    // Also accept "liveries" if you decide to rename the
    // database field in the future.
    if (liveries == null && Array.isArray(train.liveries)) {
        liveries = train.liveries;
    }

    if (!Array.isArray(liveries)) {
        liveries = liveries ? [liveries] : [];
    }

    var seen = new Set();

    return liveries.filter(function (livery) {
        if (
            typeof livery !== "string" ||
            livery.trim() === ""
        ) {
            return false;
        }

// ============================================================
// VF DRIVE DATABASE HELPERS
// ============================================================

function getMenuVFDriveNames(showAll) {
    if (
        !vfTrainDatabase ||
        typeof vfTrainDatabase !== "object"
    ) {
        return [];
    }

    // The VF drive names are the top-level JSON keys.
    var databaseNames = Object.keys(vfTrainDatabase);

    if (showAll) {
        return databaseNames.sort(compareMenuNames);
    }

    var preferredNames =
        selectedTrainData &&
        selectedTrainData.preferedVF != null
            ? selectedTrainData.preferedVF
            : [];

    if (!Array.isArray(preferredNames)) {
        preferredNames = [preferredNames];
    }

    var preferredSet = new Set(
        preferredNames.map(function (name) {
            return String(name).trim().toLowerCase();
        })
    );

    // Only return preferred drives that actually exist
    // in vf/trains.json.
    return databaseNames.filter(function (name) {
        return preferredSet.has(name.trim().toLowerCase());
    }).sort(compareMenuNames);
}

// ============================================================
// SAVED USER VF DRIVES — LOCAL STORAGE
// ============================================================

var USER_VF_STORAGE_KEY = "vf-simulator-user-trains-v1";

function getSavedUserVFDrives() {
    try {
        var stored = localStorage.getItem(USER_VF_STORAGE_KEY);

        if (!stored) return [];

        var savedDrives = JSON.parse(stored);

        if (!Array.isArray(savedDrives)) return [];

        var seen = new Set();

        return savedDrives
            .filter(function (drive) {
                return drive &&
                    typeof drive.name === "string" &&
                    drive.name.trim() !== "" &&
                    drive.config &&
                    typeof drive.config === "object" &&
                    !Array.isArray(drive.config);
            })
            .filter(function (drive) {
                var key = drive.name.trim().toLowerCase();

                if (seen.has(key)) return false;

                seen.add(key);
                return true;
            })
            .sort(function (a, b) {
                return compareMenuNames(a.name, b.name);
            });

    } catch (error) {
        console.error("Could not read saved VF drives:", error);
        return [];
    }
}

// TODO: Replace this loader with the shared VF database

function loadMenuVFDatabase() {
    if (vfTrainDatabase || vfTrainDatabasePromise) {
        return;
    }

    vfTrainDatabaseError = "";

    vfTrainDatabasePromise = fetch("vf/trains.json")
        .then(function (response) {
            if (!response.ok) {
                throw new Error(
                    "Could not load vf/trains.json: " +
                    response.status
                );
            }

            return response.json();
        })
        .then(function (database) {
            if (
                !database ||
                typeof database !== "object" ||
                Array.isArray(database)
            ) {
                throw new Error(
                    "Invalid VF trains database."
                );
            }

            vfTrainDatabase = database;
        })
        .catch(function (error) {
            vfTrainDatabaseError =
                error.message || String(error);
        })
        .then(function () {
            // Refresh the menu when loading finishes,
            // but only if the user is still on menu 8.
            if (menuStage === 8) {
                renderRouteMenu(8);
            }
        });
}

async function start_sim(e, routeOverride) {
    try {
        if (
            typeof routes === "undefined" ||
            !Array.isArray(routes)
        ) {
            throw new Error("Routes array could not be found.");
        }

        if (routeOverride) {
            if (
                typeof routeOverride.fileName !== "string" ||
                routeOverride.fileName.length === 0
            ) {
                throw new Error("Story has no valid filename.");
            }

            activeRoute = routeOverride;
        } else {
            if (
                !Number.isInteger(e) ||
                e < 0 ||
                e >= routes.length
            ) {
                throw new Error("Invalid route number: " + e);
            }

            activeRoute = routes[e];
        }

        if (!activeRoute) {
            throw new Error("Route could not be found.");
        }

        currentRoute = activeRoute.fileName;

        TRACK_GAUGE = Number(activeRoute.gauge) / 1e3;
        is_night = activeRoute.nighttime;
        use_metric_pre = activeRoute.use_metric;

        use_metric = use_metric_pre;

        if (prefer_units == 1) {
            use_metric = true;
        }

        if (prefer_units == 2) {
            use_metric = false;
        }

        make_default_values();
